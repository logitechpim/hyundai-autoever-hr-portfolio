</style></head><body><a class="skip" href="#app">본문으로 이동</a><header><div class="wrap header-inner"><button class="brand" data-nav="home" aria-label="DAY ZERO 시작 화면">DAY <b>ZERO</b><span aria-hidden="true"> _</span></button><nav aria-label="주 메뉴"><button data-nav="game">게임 플레이</button><button data-nav="proposal">HRD 기획</button><button data-nav="guide">운영 가이드</button></nav></div></header><div class="proposal"><div class="wrap"><b>미실행 HRD 프로그램 제안</b> · 공개 자료 기반 개인 프로젝트 / 공식 교육·실제 장애 사례 아님</div></div><main id="app" class="wrap"></main><footer><div class="wrap">DAY ZERO: 시스템을 복구하라 · 기획 이준호 · 2026<br>서비스와 조직, 로그와 숫자, 모든 선택의 결과는 교육용 가상 설정입니다. 게임 기록은 브라우저에만 저장됩니다.</div></footer><noscript>이 게임을 플레이하려면 브라우저에서 JavaScript를 활성화해주세요.</noscript><script>const roles=[{"code":"OPS","name":"운영 관찰자","desc":"서비스 상태와 장애 영향을 확인합니다."},{"code":"BUILD","name":"구축 분석자","desc":"변경 기록과 시스템의 연결을 확인합니다."},{"code":"CHECK","name":"차량·품질 검증자","desc":"고객이 이용하는 기능과 검증 기준을 확인합니다."},{"code":"LINK","name":"고객 조율자","desc":"고객에게 알릴 사실과 협업 요청을 정리합니다."}];
const missions=[{"id":"map","title":"누구에게 연결할 것인가","label":"사업 연결","story":"복구실의 첫 문이 잠겼습니다. 이 장애는 한 사람의 업무가 아닙니다. 세 업무를 구분하고, 필요한 협업 창구를 찾아야 합니다.","task":"세 업무를 연결한 뒤, 구축 → 운영 → 차량 SW 순서로 서류함 번호를 입력하세요.","learning":"SI, ITO, 차량 SW가 담당하는 업무의 차이를 사례로 구분합니다.","docs":[{"tag":"DOCUMENT O-01","title":"서비스 운영 인수 메모","text":"서비스를 처음 만드는 일과, 이미 돌아가는 서비스를 안정적으로 운영하는 일은 다릅니다. 오늘 장애 접수는 운영 관점에서 출발합니다.","log":"서류함 2\n업무: 기존 서비스의 상태 감시, 장애 대응, 안정적인 운영\n분류: ITO (IT Outsourcing)"},{"tag":"DOCUMENT B-01","title":"신규 시스템 구축 계약","text":"고객이 필요한 업무를 이해하고 여러 시스템을 설계하고 연결해 구축합니다. 운영 단계의 장애가 설계나 변경 이슈라면 구축 담당과 함께 봐야 합니다.","log":"서류함 4\n업무: 고객 요구 분석, 시스템 설계와 통합 구축\n분류: SI (System Integration)"},{"tag":"DOCUMENT Q-01","title":"차량 SW 검증 계획","text":"차량에서 사용하는 소프트웨어와 서버 연동 기능은 연결되어 있습니다. 차량 측의 동작은 차량 SW와 품질 관점에서도 확인해야 합니다.","log":"서류함 7\n업무: 차량 소프트웨어 개발과 검증\n분류: 차량 SW\n주의: 서버 정상만으로 차량 이용 경험을 판단하지 않는다."},{"tag":"DOCUMENT L-01","title":"복구실 안내 카드","text":"현대오토에버 사업 이해를 위한 단순화된 세 업무 관점입니다. 실제 조직도나 모든 사업 분야의 목록은 아닙니다.","log":"문 개방 순서: 구축 → 운영 → 차량 SW\n각 업무 서류함의 번호를 이어 붙인다.\n팀의 네 역할은 실제 부서명이 아닌 학습용 역할이다."}],"hints":["업무가 ‘새로 만드는 일’인지 ‘계속 운영하는 일’인지 먼저 구분하세요.","SI는 4번, ITO는 2번, 차량 SW는 7번 서류함입니다. 안내 카드의 순서를 따르세요."]},{"id":"triage","title":"지금 누구를 먼저 도울 것인가","label":"영향 판단","story":"09:15. 가상 서비스 ‘NOVA 충전예약’에서 예약 확인 문의가 들어옵니다. 관리 화면은 정상입니다. 대화창에서는 서로 다른 추측이 쏟아집니다.","task":"확인된 사실을 바탕으로 첫 대응을 정하세요. 선택한 대응은 고객 신뢰와 다음 사건에 영향을 줍니다.","learning":"추측과 확인된 사실을 구분하고, 영향을 줄이는 조치와 협업 요청을 선택합니다.","docs":[{"tag":"SIGNAL O-02","title":"서버 상태 화면","text":"서버가 응답하는지 보는 상태 지표는 정상입니다. 그러나 예약 확인 화면에서 오류 신고가 시작됐습니다. 전체 시스템 중단이라고 볼 근거는 아직 없습니다.","log":"09:10 상태 확인: 정상\n09:12 예약 결과 조회 이상 감지\n09:15 가상 문의: 예약을 했는데 앱에서 보이지 않음\n확인된 영향: 충전예약 조회 기능"},{"tag":"CHANGE B-02","title":"담당자 메시지","text":"최근 설정 변경 기록이 있습니다. 무엇이 바뀌었는지 개발 담당이 확인할 수 있습니다. 정상 지표만 보고 고객 문제를 종료할 수는 없습니다.","log":"09:12 설정 변경 기록 존재\n변경 내용: 확인 중\n요청 가능한 일: 변경 전후 비교, 가설 확인"},{"tag":"SCOPE Q-02","title":"검증 범위 메모","text":"교육 상황은 가상 충전예약 서비스에 한정합니다. 제동이나 조향 같은 차량 제어 기능에 영향을 줬다는 증거는 없습니다.","log":"차량 제어 장애: 관찰된 근거 없음\n예약 기능 확인: 추가 검증 필요\n미확인 범위까지 ‘전부 장애’라고 발표하지 않는다."},{"tag":"CUSTOMER L-02","title":"고객 지원 요청","text":"고객에게는 영향을 받은 기능, 확인 중인 내용, 다음 안내 시점을 구분해 전달해야 합니다. 문의에는 이름과 연락처가 포함되어 있어 그대로 넓게 공유하면 안 됩니다.","log":"공유할 정보: 발생 시점, 예약 기능의 증상, 익명화한 사례\n공유하지 않을 정보: 고객 이름, 연락처 원문\n교육상 다음 안내 시점: 09:25"}],"choices":[{"id":"contain","title":"문제 기능의 영향부터 줄이고, 운영·개발·검증·고객 창구를 연결한다","desc":"예약 조회 이상과 확인 중인 범위를 알리고, 필요한 정보만 공유한다.","feedback":"문제 범위를 확인하면서 피해를 줄이는 대응을 선택했습니다. 다음 안내 시점을 약속하고 최근 변경 기록을 함께 확인합니다.","points":4},{"id":"deny","title":"서버가 정상이므로 고객의 사용 실수로 안내한다","desc":"장애 대응은 멈추고 앱 재설치를 요청한다.","feedback":"가상 고객이 같은 문제를 다시 신고했습니다. 서버 응답과 고객 기능의 정상 여부는 다릅니다. 운영·개발·검증 창구를 다시 연결해야 합니다.","points":0},{"id":"broadcast","title":"모든 기능 장애라고 공지하고 고객 문의 원문을 전체 공유한다","desc":"영향 범위와 개인정보를 확인하기 전에 정보를 넓게 전달한다.","feedback":"확인되지 않은 범위가 공지에 포함됐고 불필요한 개인정보도 공유됐습니다. 공지 범위를 정정하고 필요한 사례만 남겨야 합니다.","points":0}],"hints":["서버 상태와 고객 기능은 다른 관찰입니다. 실제 신고된 기능부터 확인하세요.","영향 범위를 좁히고, 협업 창구를 연결하고, 개인정보는 최소화하는 대응을 찾으세요."]},{"id":"trace","title":"정상 화면 뒤의 12분","label":"단서 추리","story":"관리 화면은 계속 초록색입니다. 최근 변경, 예약 데이터, 앱 검증 기준을 맞춰보면 다른 이야기가 보입니다. 네 단서로 원인 가설과 시간 잠금을 풀어야 합니다.","task":"예약을 가리는 원인 가설을 선택하고, 관련 변경 시각을 4자리 숫자로 입력하세요. 로그는 모두 교육용입니다.","learning":"여러 담당자가 가진 정보를 연결해 원인 가설을 만들고 근거를 설명합니다.","docs":[{"tag":"LOG O-03","title":"운영 조회 기록","text":"서버는 응답하고 있지만 앱은 그 응답을 받아 표시하지 않습니다. 연결이 끊겼다고만 설명하면 이 차이를 놓칩니다.","log":"09:11 예약 조회: HTTP 200, 데이터 나이 12초\n09:13 예약 조회: HTTP 200, 데이터 나이 65초\nHTTP 200 = 요청 처리 응답. 고객 기능의 정상 여부는 별도 확인."},{"tag":"LOG B-03","title":"변경 이력","text":"서버가 이전 조회 결과를 재사용하는 시간을 늘렸습니다. 교육 상황의 ‘캐시’는 전에 받은 데이터를 잠깐 보관했다가 다시 쓰는 것을 말합니다.","log":"09:08 화면 문구 수정\n09:12 조회 캐시 재사용 시간: 20초 → 80초\n09:14 담당자 메모 저장\n서버 증설/중단 기록: 없음"},{"tag":"RULE Q-03","title":"앱의 유효성 기준","text":"이 가상 앱은 30초보다 오래된 예약 결과를 표시하지 않도록 설계되어 있습니다. 검증에서는 응답 상태뿐 아니라 데이터가 얼마나 최신인지도 봅니다.","log":"앱 표시 기준: 데이터 나이 30초 이하\n09:13 수신 데이터: 65초 경과 → 표시하지 않음\n차량 제어 SW 변경: 없음"},{"tag":"CLUE L-03","title":"첫 신고 타임라인","text":"앱 화면의 문구 수정은 증상과 직접 맞지 않습니다. 변경 내용과 앱의 기준을 연결해 가장 설명력이 있는 가설을 고르세요.","log":"09:11 정상 표시 확인\n09:13 첫 예약 미표시 신고\n시간 잠금 규칙: 원인 가설과 맞는 변경 시각 HHMM\n예시: 08:35라면 0835"}],"hints":["HTTP 200인데도 앱이 결과를 표시하지 않는 이유는 ‘데이터 나이’에 있습니다.","서버 캐시 80초와 앱 허용 30초가 충돌합니다. 그 설정을 바꾼 시각은 09:12입니다."]},{"id":"restore","title":"빠른 복구와 안전한 복구","label":"복구 선택","story":"캐시 설정과 앱의 표시 기준이 맞지 않았습니다. 다음 안내 시각이 다가옵니다. 지금부터는 속도만으로 좋은 선택을 설명할 수 없습니다.","task":"변경 승인, 검증, 고객 영향과 되돌릴 조건을 함께 보고 복구 계획을 선택하세요.","learning":"복구 전 검증, 담당자 승인, 단계적 적용, 중단 조건을 포함한 계획을 판단합니다.","docs":[{"tag":"PLAN O-04","title":"운영 담당의 조건","text":"다시 문제가 생기면 적용을 멈추고 승인된 이전 설정으로 되돌릴 수 있어야 합니다. 상태 감시를 끄면 악화를 놓칠 수 있습니다.","log":"필요 조건: 감시 유지 / 영향 확인 / 중단 기준\n교육상 중단 기준: 예약 표시 실패가 다시 관찰됨\n실제 승인 권한과 기준은 회사 운영 절차를 따른다."},{"tag":"PLAN B-04","title":"개발 담당의 수정안","text":"승인된 이전 설정은 캐시 재사용 20초입니다. 수정안을 검증 환경에서 확인한 뒤 일부 이용 범위부터 적용할 수 있습니다.","log":"검증할 설정: 캐시 20초\n적용 범위: 소규모 검증 후 단계 확대\n승인: 실제 도입 시 담당 권한자 확인 필수"},{"tag":"PLAN Q-04","title":"복구 확인 목록","text":"성공 응답만 확인하면 같은 문제가 다시 남을 수 있습니다. 고객이 예약 결과를 볼 수 있는지와 데이터 나이를 함께 확인해야 합니다.","log":"[ ] HTTP 응답 확인\n[ ] 데이터 나이 30초 이하\n[ ] 앱에서 예약 결과 표시\n[ ] 이상 발생 시 적용 중단·되돌림"},{"tag":"PLAN L-04","title":"고객 안내 초안","text":"확인 중인 원인과 조치 상태를 구분해 말합니다. 검증이 끝나기 전에 ‘완전 복구’라고 알리지 않습니다.","log":"안내 예시: 예약 조회 이상을 확인했습니다.\n설정 조정안을 검증 중이며 확인 결과를 다시 안내하겠습니다.\n주의: 가상 교육 문구이며 실제 공지 지침이 아니다."}],"choices":[{"id":"staged","title":"이전 설정을 검증하고 승인 후 일부 범위부터 적용한다","desc":"고객 기능을 확인하면서 단계적으로 확대하고, 이상 시 중단한다.","feedback":"가상 검증에서 예약 조회가 돌아왔습니다. 승인, 단계적 적용, 고객 기능 확인을 포함했습니다. 이제 운영 화면의 복구와 실제 예약의 복구가 같은지 확인합니다.","points":4},{"id":"fast","title":"즉시 전체 재시작하고 상태 감시는 잠시 끈다","desc":"성공 응답만 확인한 뒤 복구 완료를 알린다.","feedback":"가상 전체 재시작으로 조회는 돌아왔지만 진행 중인 요청을 확인할 기록과 검증이 부족해졌습니다. 성급한 완료 안내를 정정해야 합니다.","points":0},{"id":"hold","title":"문제 기능 이용을 제한하고 검증과 승인부터 확보한다","desc":"일부 불편을 감수하며 안내를 유지하고, 확인 후 조치를 적용한다.","feedback":"영향을 줄이고 검증을 확보하는 계획입니다. 제한으로 생긴 고객 불편과 다음 확인 시점을 함께 안내해야 합니다. 제한을 해제할 기준도 필요합니다.","points":3}],"hints":["기능 검증과 되돌릴 조건이 있는 계획을 찾으세요. 상태 감시를 끄면 문제가 커져도 놓칩니다.","단계적 적용은 일부 범위에서 검증하고 확대하는 방식입니다. 제한 유지도 상황에 따라 안전한 선택이 될 수 있습니다."]},{"id":"verify","title":"문은 열렸다. 장애는 끝났을까","label":"복구 검증","story":"09:24. 서버 정상, 데이터 최신성 정상, 예약 표시 정상. 그때 고객에게서 새 메시지가 도착합니다. ‘예약 확인이 두 개 왔어요.’ 초록색 상태 화면 뒤에 마지막 문제가 남았습니다.","task":"복구 후 확인과 인수인계에 필요한 조치 세 가지를 고르세요. 마지막 선택이 엔딩을 바꿉니다.","learning":"기술 지표 외의 고객 결과를 확인하고, 남은 문제와 후속 담당자를 기록합니다.","docs":[{"tag":"RESULT O-05","title":"복구 직후 대시보드","text":"조회 상태는 돌아왔습니다. 그러나 신규 예약 기록에는 같은 요청에서 비롯된 중복 항목이 있습니다. 상태 지표만으로 종료하면 누락됩니다.","log":"HTTP 응답: 정상\n데이터 나이: 15초\n가상 예약 요청 R-87: 확인 기록 2건\n조회 복구와 기록 정합성은 서로 다른 확인이다."},{"tag":"RESULT B-05","title":"재시도 요청 기록","text":"이 가상 상황에서 이용자가 예약 버튼을 다시 눌렀고 요청이 재시도되었습니다. 같은 요청이 여러 번 처리되지 않도록 하는 중복 방지 확인이 빠졌습니다.","log":"요청 R-87 / 재시도 1회\n동일 요청의 기록 2건 발견\n필요: 원본 보존, 중복 여부 확인, 담당 승인 아래 정정\n조치: 원인을 추측해 기록을 바로 지우지 않는다."},{"tag":"RESULT Q-05","title":"고객 기능 최종 확인","text":"응답과 표시뿐 아니라 예약 기록이 한 건으로 정확하게 남았는지까지 봐야 합니다. 가상 기록 정정 후 고객 화면과 처리 기록을 다시 확인해야 합니다.","log":"최종 기준: 고객 요청 1개에 유효한 예약 1개\n후속 검증: 중복 방지 / 정상 예약 표시 / 정정 이력\n인수인계: 남은 항목, 담당자, 다음 확인 시점"},{"tag":"RESULT L-05","title":"새로 도착한 고객 메시지","text":"복구 완료 안내를 기다리는 동안 고객에게 확인 결과와 조치 상태를 알립니다. 필요한 사람에게 필요한 정보만 전달합니다.","log":"고객 메시지: 예약 확인이 두 개 왔어요.\n공유 정보: 익명 요청 ID R-87, 중복 증상, 처리 상태\n개인정보 원문은 추가로 공유할 필요 없음."}],"choices":[{"id":"reconcile","title":"문제 요청의 추가 처리를 제한하고 기록을 보존해 담당자와 대조한다","desc":"다른 정상 기능의 이용을 불필요하게 중단하지 않는다."},{"id":"retest","title":"승인된 정정 후 고객 화면과 중복 방지 기능을 다시 검증한다","desc":"고객이 실제로 얻는 예약 결과를 확인한다."},{"id":"handover","title":"영향, 조치, 미해결 항목, 후속 담당자와 다음 안내 시점을 기록한다","desc":"필요한 정보만 공유하고 고객에게 상태를 알린다."},{"id":"erase","title":"중복으로 보이는 기록을 즉시 삭제하고 완료 공지를 낸다","desc":"담당 승인과 원본 확인을 생략한다."},{"id":"ignore","title":"초록색 상태 화면을 근거로 문의를 종료한다","desc":"고객 결과 확인은 다음 근무자에게 맡긴다."}],"hints":["조회가 정상이어도 실제 예약 기록이 정확하다는 뜻은 아닙니다. 고객의 결과를 확인하세요.","원본 보존과 대조, 승인 후 재검증, 명확한 인수인계가 필요합니다. 바로 삭제하거나 확인 없이 종료하는 조치는 제외하세요."]}];
const quiz=[{"q":"고객 요구를 분석하고 새로운 시스템을 연결해 만드는 업무에 가장 가까운 것은?","options":["SI","ITO","고객 공지"],"correct":0,"why":"SI는 시스템 설계와 통합 구축의 관점입니다."},{"q":"서버가 정상 응답하는데 고객이 예약을 확인할 수 없다면?","options":["고객 사용 실수로 결론낸다","고객 기능과 영향 범위를 추가 확인한다","모든 차량 제어 기능의 장애를 공지한다"],"correct":1,"why":"기술 지표와 고객 기능은 따로 확인해야 합니다."},{"q":"여러 담당자에게 장애 사례를 전달할 때 적절한 정보는?","options":["고객 이름과 연락처가 있는 문의 원문","확인되지 않은 전체 장애 추정","발생 시점, 증상, 익명화한 요청 사례"],"correct":2,"why":"협업에 필요한 정보만 전달하고 사실과 추측을 구분합니다."},{"q":"설정을 바꾸기 전에 필요한 계획은?","options":["검증, 승인, 적용 범위와 중단·되돌림 조건","가장 빠른 전체 재시작","상태 감시를 끄고 완료 안내"],"correct":0,"why":"복구 속도와 함께 재발과 추가 영향을 관리할 계획이 필요합니다."},{"q":"복구 후 인수인계에 포함할 것은?","options":["정상이라는 한 문장","영향, 조치, 미해결 항목, 담당자, 다음 확인 시점","책임이 있을 것으로 추정되는 사람의 이름"],"correct":1,"why":"남은 문제를 이어 처리할 수 있는 정보를 남깁니다."}];
const PROPOSAL="\n<div class=\"doc\">\n<div class=\"kicker\">HRD PROGRAM PROPOSAL / 2026.10</div>\n<h1>첫날에 배울 것은<br>우리 일이 연결되는 방식.</h1>\n<p class=\"intro\">DAY ZERO는 가상 장애를 해결하며 회사의 사업과 협업 방식을 살펴보는 신입사원 온보딩 제안입니다. 기술 지식을 시험하기보다, 모르는 상황에서 무엇을 확인하고 누구에게 도움을 요청할지 연습하도록 설계했습니다.</p>\n<div class=\"note warn\"><b>지원자 이준호의 미실행 제안</b><br>공개 자료를 바탕으로 독자적으로 기획한 교육용 시뮬레이션입니다. 현대오토에버의 공식 프로그램, 실제 장애 사례, 내부 조직도나 업무 지침이 아닙니다. 운영 결과와 교육 효과는 아직 검증하지 않았습니다.</div>\n<div class=\"actions no-print\"><button class=\"btn\" data-nav=\"game\">게임 시연</button><button class=\"btn secondary\" data-nav=\"guide\">운영 가이드</button><button class=\"btn ghost\" data-action=\"print\">기획안 인쇄</button></div>\n<h2>1. 개발 배경</h2>\n<p>현대오토에버의 공개 사업 소개에는 차량 SW, 차량 연동 서비스, 스마트팩토리, 엔터프라이즈 IT, 클라우드와 보안 등 다양한 업무가 등장합니다. 신입사원이 이 내용을 읽는 데서 한 걸음 더 나아가, 한 고객 문제에서 서로 다른 업무가 어떻게 만나는지 설명할 수 있게 하는 것이 이 제안의 출발점입니다.</p>\n<p>기존 온보딩이나 교육이 부족하다고 전제하지 않습니다. 회사 소개와 담당자 설명 이후에 넣을 수 있는 보완 활동으로 제안합니다. 이 게임은 실제 장애 대응 자격이나 현업의 기술 실무 교육을 대체하지 않습니다.</p>\n<h2>2. 대상과 교육 목표</h2>\n<div class=\"grid3\"><div class=\"card\"><span class=\"num\">WHO</span><h3>직무가 다른 신입사원</h3><p>24명 파일럿 가정. 4명씩 6개 팀으로 편성합니다. 개발 경험이 없어도 문서 안의 정보로 풀 수 있게 구성했습니다.</p></div><div class=\"card\"><span class=\"num\">WHEN</span><h3>회사 소개 이후</h3><p>입사 초기 공통 온보딩의 75분 활동으로 제안합니다. 사업 소개를 먼저 듣고, 게임에서 업무 간 연결을 연습합니다.</p></div><div class=\"card\"><span class=\"num\">OUTPUT</span><h3>근거를 설명하는 결정</h3><p>미션의 답뿐 아니라 ‘어떤 단서로 판단했는가’, ‘누구와 무엇을 확인할 것인가’를 말할 수 있어야 합니다.</p></div></div>\n<div class=\"table-scroll\"><table><thead><tr><th>학습 목표</th><th>수료 후 관찰할 행동</th><th>확인 방법</th></tr></thead><tbody>\n<tr><td>사업 이해</td><td>시스템 구축, 운영, 차량 SW의 차이를 사례 세 개에 연결한다.</td><td>사전·사후 사례 분류 문항</td></tr>\n<tr><td>증거에 기반한 판단</td><td>기술 지표와 고객 증상을 구분하고, 두 자료 이상의 근거로 가설을 설명한다.</td><td>3번 미션의 근거 설명과 관찰표</td></tr>\n<tr><td>협업 요청</td><td>필요한 협업 기능과 확인할 내용을 구체적으로 요청한다.</td><td>역할별 발언 관찰, 인수인계문</td></tr>\n<tr><td>고객·품질 관점</td><td>고객이 얻는 결과를 검증하고, 미해결 항목과 후속 담당자를 남긴다.</td><td>4·5번 미션 판단과 사후 사례</td></tr>\n</tbody></table></div>\n<h2>3. 왜 게임인가</h2>\n<p>역할마다 다른 단서를 주면 다른 사람이 가진 정보가 필요한 상황을 만들 수 있습니다. 선택 후 가상 결과를 보여주면, 첫 판단을 토론과 재검토의 재료로 쓸 수 있습니다. 제한시간은 우선순위와 인수인계를 이야기할 맥락을 제공합니다. 이 세 가지가 이 교육 방식의 설계 의도입니다.</p>\n<p><strong>재미나 몰입만으로 학습 효과를 주장하지 않습니다.</strong> 실제로 정보 공유와 판단 설명이 늘었는지는 파일럿에서 관찰해야 합니다. 기술 용어 때문에 참여가 어려워지거나 한 사람이 답을 독점하면 활동을 수정합니다. 사전 용어 설명과 종료 후 20분 디브리핑을 필수로 두었습니다.</p>\n<h2>4. 교육과정 구성</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>시간</th><th>활동</th><th>진행 포인트</th></tr></thead><tbody>\n<tr><td>5분</td><td>사전 문항</td><td>개인별로 응답. 답 공개 없이 출발 수준을 확인.</td></tr>\n<tr><td>10분</td><td>브리핑과 역할 배정</td><td>가상 상황, 용어, 팀 규칙, 기록 범위를 안내.</td></tr>\n<tr><td>35분</td><td>게임 5개 미션</td><td>네 역할이 단서를 말로 공유하고 팀의 결정을 입력.</td></tr>\n<tr><td>20분</td><td>디브리핑</td><td>결정 → 근거 → 가상 결과 → 실제 적용 순서로 토론.</td></tr>\n<tr><td>5분</td><td>사후 문항과 개인 회고</td><td>새 사례에 적용하고, 도움을 요청할 일을 하나 기록.</td></tr>\n<tr><td><strong>총 75분</strong></td><td>공통 온보딩 보완 활동</td><td>12분 시연 모드와 시간 제한 없는 탐색 모드는 별도 제공.</td></tr>\n</tbody></table></div>\n<h2>5. 미션과 학습 목표</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>미션</th><th>게임 장치</th><th>배울 내용</th><th>진행자 확인</th></tr></thead><tbody>\n<tr><td>01 사업 연결 / 5분</td><td>업무 분류와 서류함 암호</td><td>SI, ITO, 차량 SW의 업무 구분</td><td>답의 숫자보다 분류 이유를 물음</td></tr>\n<tr><td>02 영향 판단 / 6분</td><td>서로 다른 신고와 첫 대응 선택</td><td>사실과 추측, 고객 영향, 최소 정보 공유</td><td>확인되지 않은 영향을 단정하지 않는가</td></tr>\n<tr><td>03 단서 추리 / 8분</td><td>변경 시각과 표시 기준의 충돌</td><td>여러 자료를 연결한 원인 가설</td><td>로그와 기준을 함께 설명하는가</td></tr>\n<tr><td>04 복구 선택 / 7분</td><td>시간 압박 속 세 복구 계획</td><td>검증, 승인, 단계적 적용과 중단 조건</td><td>빠른 선택의 추가 영향을 보는가</td></tr>\n<tr><td>05 복구 검증 / 9분</td><td>정상 표시 뒤 중복 예약 반전</td><td>고객 결과 확인과 인수인계</td><td>완료 선언 전에 남은 문제를 기록하는가</td></tr>\n</tbody></table></div>\n<h2>6. 운영 인력과 준비물</h2>\n<p><strong>24명, 6개 팀 기준:</strong> 진행자 1명과 관찰·지원 담당 2명을 가정합니다. 관찰자 한 명이 3개 팀을 담당하며, 핵심 장면 두 번씩 표본 관찰합니다. 모든 발언을 전수 평가하는 구조는 아닙니다.</p>\n<ul><li>팀별 노트북 1대와 큰 화면, 역할 카드 4장, 메모용지와 필기구</li><li>타이머는 공용 기기 한 대에서 운영. 이 버전은 한 기기를 함께 사용하는 팀 활동이며 실시간 온라인 다중 접속 기능은 없습니다.</li><li>역할 카드를 출력해 각자 읽고, 팀의 기록 담당자가 공용 화면에 결정을 입력합니다. 시작 역할은 미션마다 바꿉니다.</li><li>기술 용어 안내와 진행자 정답표. 네트워크 문제에 대비한 단일 HTML 게임 파일.</li><li>접근성 확인: 색상 외 텍스트 표시, 키보드 조작, 쉬운 용어 설명, 시간 제한 해제 옵션. 실제 참여자 대상으로 추가 확인 필요.</li></ul>\n<h2>7. 예산 가정</h2>\n<p>아래는 1회 파일럿을 검토하기 위한 계산 예시입니다. 견적이나 실제 지출이 아닙니다. 사내 공간과 기존 노트북을 활용하고, 내려받은 게임을 로컬에서 실행하는 조건입니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>항목</th><th>계산 가정</th><th>금액</th></tr></thead><tbody>\n<tr><td>역할 카드와 인쇄물</td><td>24명 × 500원</td><td>12,000원</td></tr>\n<tr><td>팀별 필기구 등</td><td>6팀 × 3,000원</td><td>18,000원</td></tr>\n<tr><td>다과</td><td>24명 × 5,000원</td><td>120,000원</td></tr>\n<tr><td>예비비</td><td>위 직접비 150,000원의 10%</td><td>15,000원</td></tr>\n<tr><td><strong>직접비 합계</strong></td><td>1인당 6,875원</td><td><strong>165,000원</strong></td></tr>\n<tr><td>당일 내부 운영 공수</td><td>3명 × 준비 포함 2시간 × 시간당 50,000원</td><td>300,000원</td></tr>\n<tr><td><strong>1회 운영비 예시</strong></td><td>직접비 + 내부 운영 공수</td><td><strong>465,000원</strong></td></tr>\n<tr><td>초기 설계·구현·검수 별도</td><td>HRD 16시간 + 웹 24시간 + 현업 검수 8시간 = 48시간 × 50,000원</td><td>2,400,000원</td></tr>\n</tbody></table></div>\n<p class=\"smalltext\">초기 공수는 향후 도입 검토를 위한 가정이며 이 포트폴리오의 실제 제작 시간 기록이 아닙니다. 호스팅·기기 대여·공간 대관·참가자 인건비·부가세는 별도 산정해야 합니다.</p>\n<h2>8. 교육 효과 평가</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>단계</th><th>지표와 방법</th><th>해석 범위</th></tr></thead><tbody>\n<tr><td>참여 경험</td><td>난이도, 역할 참여 기회, 업무 이해 도움을 5점 척도와 의견으로 수집</td><td>만족도는 학습 성과와 구분</td></tr>\n<tr><td>지식·판단</td><td>개인별 사전 A형 5문항 / 사후 B형 5문항. 새 사례 분류와 판단 확인</td><td>등가 난이도는 아직 미검증. 평균 변화와 문항별 오답을 함께 확인</td></tr>\n<tr><td>활동 중 행동</td><td>정보 공유, 근거 설명, 구체적 협업 요청, 미해결 항목 기록을 0~2점 관찰</td><td>실제 협업은 사람이 관찰. 화면의 열람·공유 클릭은 참고 기록</td></tr>\n<tr><td>업무 적용 확인</td><td>2주 후 실제 도움이 필요했던 상황과 요청 방식을 참여자·멘토가 회고</td><td>자가 보고와 사례 확인. 게임이 원인이라고 단정하지 않음</td></tr>\n</tbody></table></div>\n<p><strong>파일럿 검토 기준 제안:</strong> 참가자의 80% 이상이 사후 문항 4개 이상 정답, 관찰 장면에서 모든 역할이 최소 한 번 단서나 근거를 발언, 운영 시간 내 디브리핑 20분 확보. 이는 달성 결과가 아닌 목표안입니다. 사전 점수가 이미 높으면 향상 폭 대신 새 사례 적용과 참여 조건을 봅니다.</p>\n<p>현재 웹 게임은 첫 판단 점수, 선택 이력, 재검토 횟수, 힌트 사용과 사후 확인 퀴즈를 제공합니다. 사전·사후 평가와 실제 발언 관찰은 운영 가이드의 별도 양식으로 진행합니다. 온라인 사후 퀴즈는 문제 확인용이며 A·B형 평가와 같은 검사지가 아닙니다.</p>\n<h2>9. 실제 도입 전 확인할 일</h2>\n<ol><li><strong>현업 검수:</strong> 사업 설명, 협업 기능, 승인과 정보 공유 기준을 실제 담당자와 점검. 가상 역할을 실제 연락 창구와 연결하는 안내는 승인 후 추가.</li><li><strong>소규모 사용성 확인:</strong> 4~8명에게 읽기 난이도, 단서 논리, 진행 시간, 역할 독점을 관찰. 정답률만으로 난이도를 정하지 않음.</li><li><strong>24명 파일럿:</strong> 사전·사후 문항과 관찰 기록을 수집. 채용이나 인사평가 점수로 사용하지 않음.</li><li><strong>수정 후 도입 판단:</strong> 목표 충족 여부와 운영 부담을 함께 확인. 기술 배경에 따른 참여 격차가 크면 단서와 브리핑을 수정.</li></ol>\n<p>현재 버전은 브라우저에만 진행 정보를 저장하며 서버로 평가 기록을 보내지 않습니다. 실제 운영 시 수집 목적, 항목, 접근자와 보관 기간을 안내하고 사내 기준에 맞춰 정해야 합니다. 이 버전의 파일 저장은 운영자가 직접 선택한 기록만 내려받습니다.</p>\n<h2>10. 공개 자료와 설계의 경계</h2>\n<ul><li><a href=\"https://www.hyundai-autoever.com/kor/main/index.do\" target=\"_blank\" rel=\"noopener\">현대오토에버 공식 사업 소개</a> — 사업과 서비스 범위 참고. 홈페이지는 Mobility, Manufacturing, Enterprise, Digital Foundation 영역으로 소개합니다.</li><li><a href=\"https://career.hyundai-autoever.com/ko/servicesw\" target=\"_blank\" rel=\"noopener\">공식 채용 사이트 Service SW 직무 소개</a> — 프로젝트 관리, 설계, 개발·운영 역할 참고.</li><li><a href=\"https://www.hyundai-autoever.com/kor/business-area/in-vehicle-it/edge-cloud-computing/contents.do?cntnSeq=348\" target=\"_blank\" rel=\"noopener\">공식 차량 연동 서비스 소개</a> — 서버와 차량 연동 업무 맥락 참고.</li><li><a href=\"https://www.hyundai-autoever.com/kor/business-area/digital-transformation/sdf/contents.do?cntnSeq=455\" target=\"_blank\" rel=\"noopener\">공식 SDF(Factory) 소개</a> — 제조와 IT 업무의 연결 참고.</li><li><a href=\"https://www.hyundai-autoever.com/kor/about/pr/news/view.do?detailsKey=4114\" target=\"_blank\" rel=\"noopener\">공식 2022년 2분기 실적 발표</a> — SI, ITO, 차량 SW 용어 참고. 당시 자료이며 현재 전체 사업 분류로 단정하지 않습니다.</li></ul>\n<p class=\"smalltext\">자료 확인: 2026.10.11. 서비스 ‘NOVA’, 모든 로그·숫자·인물·조직·승인 조건·고객 메시지·선택의 결과는 지원자가 만든 가상 설정입니다. 게임 방식의 교육 효과는 이 프로젝트에서 실증하지 않았습니다.</p>\n</div>";
const GUIDE="\n<div class=\"doc\">\n<div class=\"kicker\">FACILITATOR GUIDE / SPOILERS INCLUDED</div>\n<h1>게임이 끝난 뒤,<br>판단을 다시 꺼내보세요.</h1>\n<p class=\"intro\">승패를 발표하기보다, 팀이 왜 그렇게 결정했는지 듣습니다. 시간 안에 끝내지 못한 팀도 인수인계를 소재로 같은 학습 목표를 확인할 수 있습니다.</p>\n<div class=\"note warn\"><b>미실행 프로그램 운영안</b><br>미션 해설이 포함되어 있습니다. 실제 교육에서는 참가자가 게임 전에 보지 않도록 운영자가 별도로 관리하세요. 이 웹페이지는 보안으로 정답을 숨기는 서비스가 아닙니다.</div>\n<div class=\"actions no-print\"><button class=\"btn\" data-action=\"print\">운영 가이드 인쇄</button><button class=\"btn secondary\" data-nav=\"roles\">역할 카드 4종 보기</button><button class=\"btn ghost\" data-action=\"downloadGuide\">가이드 텍스트 저장</button></div>\n<h2>시작 전 체크</h2>\n<ul><li>진행자는 게임을 한 번 끝까지 풀어보고 오답·시간 초과 화면을 확인합니다.</li><li>팀별 기기에서 시작 화면과 타이머를 확인합니다. 게임 HTML을 내려받아 인터넷 없이 여는 예비 방식을 준비합니다.</li><li>기존 진행 기록이 있는 기기는 새 게임 시작을 선택합니다. 게임 파일 안의 모든 정보는 가상입니다.</li><li>역할 카드 4종과 관찰표를 출력합니다. 팀 기록 담당 한 명이 공용 화면을 조작합니다.</li><li>말하기나 읽기에 보완이 필요한 참여자에게 시간 제한 해제, 큰 글씨·확대, 짝 읽기 등 참여 방식을 조정합니다.</li></ul>\n<h2>10분 브리핑 대본</h2>\n<div class=\"card\"><p>“오늘은 회사의 여러 업무가 한 고객 문제에서 어떻게 연결되는지 살펴봅니다. 여러분은 실제 운영 시스템이 아닌 가상 복구실에 들어갑니다. 코드를 작성하거나 기술 명령을 실행할 필요는 없습니다.”</p>\n<p>“팀원 네 명이 서로 다른 단서를 맡습니다. 본인의 단서와 판단 근거를 팀에 말해주세요. 네 역할의 공유 표시가 끝나면 팀의 결정을 입력합니다. 공유 표시는 기록을 돕는 장치이고, 실제 대화가 있었다는 증명은 아닙니다.”</p>\n<p>“모르면 용어 설명이나 힌트를 사용하세요. 도움을 요청했다고 점수를 깎지 않습니다. 속도 순위는 매기지 않습니다. 실수나 미완료는 종료 후 토론할 자료가 됩니다.”</p>\n<p>“기록은 브라우저에만 남습니다. 결과 파일을 저장할 때도 실명이나 실제 고객 정보는 입력하지 마세요.”</p></div>\n<h2>팀 역할과 회전</h2>\n<p>운영 관찰자, 구축 분석자, 차량·품질 검증자, 고객 조율자는 학습용 관점입니다. 실제 현대오토에버 부서명이나 직책이 아닙니다. 미션마다 첫 설명 역할을 한 칸씩 바꾸고, 누가 입력하든 결정 전에 네 명에게 근거를 묻습니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>시점</th><th>진행자 행동</th><th>도움말</th></tr></thead><tbody>\n<tr><td>시작</td><td>4명 역할 배정. 35분 교육 모드 시작.</td><td>한 기기를 함께 쓰며 각자 카드로 단서를 읽음</td></tr>\n<tr><td>8분 경과</td><td>모든 역할이 말했는지 표본 관찰.</td><td>“아직 듣지 못한 단서는 누구에게 있나요?”</td></tr>\n<tr><td>18분 경과</td><td>가설의 근거를 물음.</td><td>“어떤 두 자료를 연결했나요?”</td></tr>\n<tr><td>28분 경과</td><td>복구 후 확인과 인수인계 강조.</td><td>“다음 담당자에게 무엇을 남겨야 할까요?”</td></tr>\n<tr><td>35분 종료</td><td>완료·미완료 모두 토론으로 이동.</td><td>타임아웃 팀은 현재 상태부터 인수인계문 작성</td></tr>\n</tbody></table></div>\n<h2>미션 해설과 개입 기준</h2>\n<details><summary>01 사업 연결 — 정답 427</summary><p>고객 요구 분석과 신규 통합 구축은 SI, 기존 서비스 감시와 장애 대응은 ITO, 차량 소프트웨어 개발·검증은 차량 SW입니다. 서류함 4, 2, 7을 구축 → 운영 → 차량 SW 순서로 연결합니다. 숫자를 맞힌 뒤 실제로 어떤 차이가 있는지 한 명에게 설명하도록 요청합니다.</p><p>막힐 때: “처음 만드는 업무와 계속 운영하는 업무는 어느 카드에 있나요?” 정답을 바로 주기보다 분류의 기준을 말하게 합니다.</p></details>\n<details><summary>02 영향 판단 — 범위를 확인하면서 협업 창구 연결</summary><p>조회 기능의 문제가 확인됐지만 차량 제어 장애의 증거는 없습니다. 서버 응답만 보고 고객 문제를 부정하거나 전체 장애라고 단정하지 않습니다. 영향 범위를 확인하고 필요한 정보만 운영·개발·검증·고객 창구에 공유합니다. 개인정보 원문은 전달할 필요가 없습니다.</p><p>다른 선택도 다음 미션으로 이어집니다. 공지 정정과 고객 혼선이라는 가상 결과를 보여주고, “어떤 사실은 알았고 어떤 부분은 아직 몰랐나요?”를 묻습니다.</p></details>\n<details><summary>03 단서 추리 — 캐시 80초와 표시 기준 30초, 변경 시각 0912</summary><p>09:12 캐시 재사용 시간이 20초에서 80초로 늘었습니다. 09:13 응답은 HTTP 200이지만 데이터 나이는 65초입니다. 앱은 30초보다 오래된 데이터를 표시하지 않습니다. 이 자료들이 원인 가설을 지지합니다. 암호는 0912입니다.</p><p>원인 확정과 구분: 게임에서 가장 설명력이 있는 가설을 찾았어도 조치 전 검증이 필요합니다. 실제 시스템의 캐시 기준을 말하는 자료가 아닙니다.</p></details>\n<details><summary>04 복구 선택 — 검증·승인·단계 적용·중단 조건</summary><p>이전 20초 설정을 검증하고 승인 후 단계적으로 적용하는 계획이 가장 완결되어 있습니다. 기능 이용을 제한하며 검증과 승인을 확보하는 선택도 안전한 대안입니다. 제한 해제와 고객 안내 조건을 함께 정해야 합니다.</p><p>전체 재시작, 상태 감시 중단, 응답 상태만 보고 완료 안내는 추가 영향을 확인하기 어렵게 합니다. 실제 조치 명령과 승인 절차는 현업 규정에 따릅니다.</p></details>\n<details><summary>05 복구 검증 — 기록 대조, 재검증, 인수인계 세 가지</summary><p>조회가 돌아와도 요청 R-87의 예약 기록은 중복으로 남았습니다. 문제 요청의 추가 처리를 제한하고 원본을 보존해 담당자와 대조합니다. 승인된 정정 이후 고객 화면과 중복 방지를 확인하고, 남은 항목과 후속 담당자를 기록합니다.</p><p>갑자기 기록을 지우거나 초록색 화면을 근거로 종료하면 미해결 엔딩이 됩니다. 실제 고객 결과를 확인하는 것이 마지막 학습 포인트입니다.</p></details>\n<h2>20분 디브리핑</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>시간</th><th>질문</th><th>받아낼 내용</th></tr></thead><tbody>\n<tr><td>3분</td><td>“첫 판단과 가장 뜻밖의 장면은 무엇이었나요?”</td><td>감정과 사실을 먼저 회상</td></tr>\n<tr><td>6분</td><td>“그 결정을 한 근거는 무엇이었나요? 다른 역할의 정보가 판단을 바꾼 장면은?”</td><td>선택, 단서, 가상 결과 연결</td></tr>\n<tr><td>6분</td><td>“실제 업무에서 같은 정보가 없다면 누구에게 무엇을 물어야 할까요?”</td><td>실제 연락 창구는 담당자의 승인된 안내로 연결</td></tr>\n<tr><td>5분</td><td>“완료를 선언하기 전에 무엇을 확인하고, 다음 담당자에게 무엇을 남길까요?”</td><td>팀별 인수인계 3문장과 개인 적용 행동 1개</td></tr>\n</tbody></table></div>\n<div class=\"card\"><h3>인수인계 세 문장 양식</h3><p>1. 확인된 영향과 사실: __________________________________</p><p>2. 조치와 검증 결과 / 아직 확인하지 못한 것: _________________</p><p>3. 후속 담당자가 확인할 일과 다음 안내 시점: _________________</p></div>\n<h2>관찰표 — 실제 대화를 사람이 확인</h2>\n<p>0점 = 관찰되지 않음, 1점 = 진행자의 질문 후 수행, 2점 = 자발적으로 수행. 관찰하지 못한 항목은 0점 대신 ‘미관찰’로 남깁니다. 관찰 장면이 한정되어 있으므로 개인 역량이나 인사평가로 해석하지 않습니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>행동</th><th>0 / 1 / 2 / 미관찰</th><th>관찰한 발언·행동</th></tr></thead><tbody>\n<tr><td>서로 다른 역할의 단서를 공유함</td><td>________________</td><td>________________________</td></tr>\n<tr><td>두 자료 이상을 연결해 근거를 설명함</td><td>________________</td><td>________________________</td></tr>\n<tr><td>누구에게 무엇을 확인할지 요청함</td><td>________________</td><td>________________________</td></tr>\n<tr><td>고객 결과와 미해결 항목을 기록함</td><td>________________</td><td>________________________</td></tr>\n</tbody></table></div>\n<h2>사전 A형 / 사후 B형 문항</h2>\n<p>두 유형 모두 개인별 5문항, 각 1점입니다. 사전에는 답을 공개하지 않습니다. 아래 정답표는 진행자만 봅니다. 두 유형의 난이도와 동등성은 파일럿에서 확인해야 합니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>영역</th><th>A형 — 사전</th><th>B형 — 사후</th></tr></thead><tbody>\n<tr><td>1. 업무 구분</td><td>새 물류 관리 시스템의 요구를 분석하고 시스템을 연결해 구축한다. SI / ITO / 차량 SW?</td><td>이미 운영 중인 시스템의 상태를 감시하고 장애를 처리한다. SI / ITO / 차량 SW?</td></tr>\n<tr><td>2. 정상 판단</td><td>서버 응답은 정상인데 앱에서 조회가 안 된다. ① 고객 실수로 종료 ② 고객 기능 추가 확인 ③ 전체 차량 장애 공지</td><td>서버 지표는 정상인데 동일 주문이 두 번 기록됐다. ① 복구 완료로 종료 ② 기록 정합성과 고객 결과 확인 ③ 관련 기록 즉시 삭제</td></tr>\n<tr><td>3. 정보 공유</td><td>장애 협업에 공유할 것은? ① 고객 연락처 원문 ② 추측한 전체 장애 ③ 발생 시점과 익명 증상 사례</td><td>오류를 다른 담당자에게 문의할 때? ① 개인정보가 있는 전체 화면 ② 근거 없는 책임 추정 ③ 익명 요청 ID와 재현 증상</td></tr>\n<tr><td>4. 복구 계획</td><td>변경안 적용 전? ① 검증·승인·중단 조건 확보 ② 전체 재시작부터 ③ 감시 중단</td><td>검증한 설정을 확대할 때? ① 승인된 범위부터 적용하며 고객 기능과 중단 기준 확인 ② 모두에게 즉시 적용 ③ 성공 응답만 보고 완료</td></tr>\n<tr><td>5. 인수인계</td><td>교대 시 기록할 것은? ① 정상이라는 한 문장 ② 영향·조치·남은 항목·담당·시점 ③ 책임자 추측</td><td>복구 후 후속 담당에게? ① 완료 표시만 전달 ② 검증 결과·미해결 항목·담당·시점 ③ 문의 원문 전체</td></tr>\n</tbody></table></div>\n<details><summary>진행자 정답표와 해석</summary><p>A형: 1 SI / 2 ② / 3 ③ / 4 ① / 5 ②. B형: 1 ITO / 2 ② / 3 ③ / 4 ① / 5 ②.</p><p>사후 평균 점수와 사전 대비 변화를 함께 보고, 문항별 오답을 확인합니다. 2·3번이 반복적으로 틀리면 기술 지표와 고객 영향, 정보 공유 범위 설명을 보완합니다. 높은 만족도만으로 판단 개선을 결론 내리지 않습니다.</p></details>\n<h2>기록과 2주 후 확인</h2>\n<p>게임 결과 JSON은 팀명, 모드, 첫 판단 점수, 선택 이력, 힌트 수, 재검토 횟수, 사후 퀴즈와 회고를 담습니다. 팀명에는 실명을 쓰지 않습니다. 이 웹 버전은 서버로 기록을 전송하지 않습니다. 기기별 저장이므로 다른 컴퓨터나 브라우저에서 자동으로 이어지지 않습니다.</p>\n<p>실제 운영에서는 기록 수집과 보관을 사내 기준에 맞춰 안내합니다. 2주 뒤에는 “도움이 필요했던 상황”, “누구에게 어떤 정보로 요청했는가”, “이번 활동에서 적용한 점과 어려웠던 조건”을 물어 참여자 회고와 멘토의 확인 사례를 모읍니다. 원래 업무 경험과 다른 교육의 영향을 구분하며, 게임만의 효과로 단정하지 않습니다.</p>\n<h2>운영 예외</h2>\n<ul><li><strong>시간 초과:</strong> 게임이 자동 종료되고 현재 기록이 남습니다. 남은 문제의 인수인계로 토론합니다. 새 게임은 별도 세션으로 시작합니다.</li><li><strong>접속·기기 문제:</strong> 타이머를 일시정지하고 내려받은 HTML을 실행하거나 역할 카드로 진행합니다. 장애 시간을 실패로 처리하지 않습니다.</li><li><strong>한 사람이 독점:</strong> 입력 담당자를 바꾸고, 아직 말하지 않은 역할에 단서 설명을 요청합니다.</li><li><strong>정답표 노출:</strong> 공개 시연 페이지의 해설은 열람 가능하므로 고부담 평가에 사용하지 않습니다. 실제 파일럿은 진행자 자료를 분리합니다.</li><li><strong>실제 사고 사례 등장:</strong> 구체적인 고객·시스템 정보를 입력하지 않고 교육용 사례로 되돌립니다.</li></ul>\n</div>";


function fresh(mode,team,now){return {version:1,mode:mode,team:team||'DAY ZERO 팀',stage:0,status:'playing',paused:false,remaining:mode==='untimed'?null:(mode==='demo'?720:2100),deadline:mode==='untimed'?null:now+(mode==='demo'?720000:2100000),startedAt:now,read:Array.from({length:5},function(){return [false,false,false,false]}),attempts:[0,0,0,0,0],firstPoints:[null,null,null,null,null],hints:[0,0,0,0,0],history:[],decisions:{},quiz:null,reflection:''};}
function timeLeft(s,now){if(s.remaining===null)return null;if(s.paused||s.status!=='playing')return Math.max(0,s.remaining);return Math.max(0,Math.ceil((s.deadline-now)/1000));}
function expire(s,now){if(s.status==='playing'&&!s.paused&&s.deadline!==null&&timeLeft(s,now)===0){s.remaining=0;s.status='timeout';s.history.push({mission:s.stage,event:'시간 종료',text:'제한시간 종료. 현재 상황을 인수인계합니다.',at:now});return true}return false;}
function pauseState(s,now){if(s.status!=='playing'||s.remaining===null)return;if(!s.paused){s.remaining=timeLeft(s,now);s.paused=true;s.deadline=null}else{s.deadline=now+s.remaining*1000;s.paused=false}}
function solve(s,a,now){if(s.status!=='playing')return {ok:false,message:'이미 종료된 세션입니다.'};if(expire(s,now))return {ok:false,timeout:true,message:'제한시간이 종료됐습니다.'};if(s.paused)return {ok:false,message:'타이머를 재개한 뒤 결정하세요.'};const i=s.stage;if(!s.read[i].every(Boolean))return {ok:false,message:'네 역할의 단서를 확인하고 팀에 공유 표시를 해주세요.'};let correct=false,p=0,text='',adv=true;
if(i===0){correct=a.si==='si'&&a.ito==='ito'&&a.sw==='sw'&&String(a.code).trim()==='427';p=correct?4:0;adv=correct;text=correct?'구축(SI) 4 → 운영(ITO) 2 → 차량 SW 7. 서로 다른 업무가 연결됩니다.':'업무 연결과 서류함 순서를 다시 확인하세요. 새로운 시스템을 만드는 것은 SI, 기존 서비스를 운영하는 것은 ITO입니다.'}
if(i===1){const ch=missions[1].choices.find(function(c){return c.id===a.choice});if(!ch)return {ok:false,message:'첫 대응을 하나 선택하세요.'};p=ch.points;correct=p===4;text=ch.feedback;s.decisions.triage=ch.id}
if(i===2){correct=a.root==='cache'&&String(a.code).trim()==='0912';p=correct?4:0;adv=correct;text=correct?'서버의 재사용 시간 80초와 앱의 허용 기준 30초가 충돌합니다. 관련 설정 변경은 09:12입니다. 아직 원인 가설이므로 복구 전 검증이 필요합니다.':'응답은 성공했지만 데이터가 오래되어 앱이 표시하지 않습니다. 관련 설정 변경의 시각과 가설을 함께 확인하세요.'}
if(i===3){const ch=missions[3].choices.find(function(c){return c.id===a.choice});if(!ch)return {ok:false,message:'복구 계획을 하나 선택하세요.'};p=ch.points;correct=p>=3;text=ch.feedback;s.decisions.restore=ch.id}
if(i===4){const v=Array.isArray(a.choices)?a.choices:[];if(v.length!==3)return {ok:false,message:'최종 조치 세 가지를 선택하세요.'};const safe=['reconcile','retest','handover'];p=safe.filter(function(x){return v.includes(x)}).length;correct=v.every(function(x){return safe.includes(x)})&&v.length===3;p=correct?4:Math.max(0,p-1);s.decisions.verify=v;text=correct?'기록을 보존해 대조하고, 승인된 정정과 재검증을 거쳐 남은 문제를 인수인계했습니다. 고객의 실제 결과까지 확인하는 복구입니다.':'원본 대조와 승인 없이 기록을 삭제하거나, 고객 결과를 확인하지 않고 종료하면 미해결 문제가 남습니다. 결과 화면에서 선택의 영향을 확인하세요.'}
s.attempts[i]++;if(s.firstPoints[i]===null)s.firstPoints[i]=p;s.history.push({mission:i,event:adv?'결정':'재검토',answer:a,points:p,text:text,at:now});if(adv){s.stage++;if(s.stage===5){s.remaining=timeLeft(s,now);s.status='complete';s.finishedAt=now}}return {ok:true,advance:adv,correct:correct,message:text,mission:i};
}
function ending(s){if(s.status==='timeout')return {title:'교대가 필요한 복구',tag:'HANDOVER REQUIRED',desc:'시간 안에 모든 검증을 마치지 못했습니다. 지금 확인된 사실과 남은 항목을 다음 담당자가 이어받도록 정리하세요.',tone:'warn'};
const v=s.decisions.verify||[];if(v.includes('erase')||v.includes('ignore'))return {title:'완료 선언, 그러나 미복구',tag:'UNRESOLVED',desc:'화면의 정상 신호만으로는 복구가 끝나지 않았습니다. 고객 결과 확인과 기록 대조가 빠져 남은 문제가 있습니다.',tone:'error'};
if(s.decisions.restore==='fast')return {title:'복구 뒤에 남은 비용',tag:'RECOVERY WITH REWORK',desc:'마지막 검증으로 남은 문제를 발견했지만, 성급한 전체 조치와 완료 안내로 불필요한 재작업과 고객 혼선이 생겼습니다.',tone:'warn'};
if(s.decisions.triage!=='contain')return {title:'복구 완료, 안내는 다시',tag:'SERVICE RECOVERED',desc:'기능과 고객 결과를 확인했습니다. 초기의 과도한 공지나 성급한 판단은 정정하고 공유 범위를 바로잡아야 합니다.',tone:'warn'};
return {title:'고객의 결과까지 복구했다',tag:'VERIFIED RECOVERY',desc:'영향을 줄이고, 근거를 연결하고, 검증된 조치를 적용했습니다. 마지막으로 고객의 예약 결과와 후속 담당자까지 확인했습니다.',tone:'good'};}


const KEY='day-zero-v1';
let standaloneQuiz=null,state=null,view='home',roleIndex=0,feedback=null,storageBlocked=false,toastTimer;
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s.version===1&&Number.isInteger(s.stage)&&s.stage>=0&&s.stage<=5&&['playing','complete','timeout'].includes(s.status)&&Array.isArray(s.read)&&s.read.length===5&&s.read.every(function(x){return Array.isArray(x)&&x.length===4})&&Array.isArray(s.history)&&Array.isArray(s.firstPoints)&&s.firstPoints.length===5&&(s.remaining===null||(Number.isFinite(s.remaining)&&s.remaining>=0))&&(s.status!=='playing'||s.paused||s.remaining===null||Number.isFinite(s.deadline)))state=s;}}catch(e){storageBlocked=true}
function save(){if(!state)return;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageBlocked=true}}
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';e.setAttribute('role','status');document.body.appendChild(e)}e.textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(function(){e.remove()},4500)}
function fmt(t){if(t===null)return '제한 없음';return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function capture(){if(!state||view!=='game'||state.stage>=5)return;const f=document.getElementById('mission-form');if(!f)return;const d={};new FormData(f).forEach(function(v,k){if(k==='choices'){if(!d.choices)d.choices=[];d.choices.push(v)}else d[k]=v});state.drafts=state.drafts||{};state.drafts[state.stage]=d;}
function draft(){return state&&state.drafts&&state.drafts[state.stage]||{}}
function navigate(v){capture();feedback=null;view=['home','game','proposal','guide','roles','quiz'].includes(v)?v:'home';if(location.hash.slice(1)!==view)history.replaceState(null,'','#'+view);render();window.scrollTo(0,0)}
function pageTitle(){return view==='proposal'?'HRD 기획':view==='guide'?'운영 가이드':view==='roles'?'역할 카드':view==='quiz'?'학습 확인':'게임'}

function homeHTML(){return '<div class="hero"><div><div class="kicker">DAY ZERO / ONBOARDING SIMULATION</div><h1>첫 출근.<br>첫 장애.<br><em>첫 번째 협업.</em></h1><p class="hero-lead">서버는 정상인데, 고객은 예약을 볼 수 없다.<br>흩어진 단서를 연결하고 시스템을 복구하세요.</p><div class="actions"><a href="#setup" class="btn">복구실 입장 <span aria-hidden="true">↗</span></a><button class="btn secondary" data-nav="proposal">기획 의도 보기</button></div><div class="hero-facts"><div><b>4명</b><span>한 기기를 함께 쓰는 팀</span></div><div><b>35분</b><span>교육 게임 권장 시간</span></div><div><b>5개</b><span>판단과 협업 미션</span></div></div></div><div class="incident-card"><div class="incident-bar"><span><i class="status-dot"></i>SIMULATED INCIDENT</span><span>09:15:00</span></div><div class="incident-body"><span class="badge live">예약 조회 이상</span><h3>NOVA 충전예약 서비스</h3><div class="linegrid"><div class="signal good"><span>SERVER</span><b>정상 응답</b></div><div class="signal good"><span>NETWORK</span><b>연결됨</b></div><div class="signal bad"><span>CUSTOMER</span><b>예약 미표시</b></div></div><div class="log">09:12 최근 설정 변경 감지<br>09:13 첫 예약 조회 문의<br><span class="critical">09:15 “예약을 했는데 앱에서 안 보여요.”</span><br>현재 원인 / 확인 중</div><p class="smalltext" style="margin:16px 0 0">서비스명, 수치와 모든 기록은 교육용 가상 설정입니다.</p></div></div></div>'+(state?'<div class="notice-fixed inline-row"><span>'+esc(state.team)+' · '+(state.status==='playing'?(state.paused?'일시정지 중':'미션 '+Math.min(state.stage+1,5)+' 진행 중'):'저장된 결과 있음')+'</span><button class="btn small secondary" data-nav="game">'+(state.status==='playing'?'이어서 플레이':'결과 보기')+'</button></div>':'')+'<div class="section"><div class="sectionhead"><h2>네 사람의 정보가 모여야<br>한 문제를 볼 수 있습니다.</h2><p class="muted">개발 지식 없이, 단서 안의 정보로 풀 수 있습니다.</p></div><div class="grid3"><div class="card"><span class="num">01 / FIND</span><h3>다른 관점의 단서</h3><p>운영, 구축, 검증, 고객 관점에서 각자 알고 있는 사실을 팀에 전달합니다.</p></div><div class="card"><span class="num">02 / DECIDE</span><h3>근거를 가진 선택</h3><p>무엇이 확인됐고 무엇이 아직 추측인지 구분합니다. 선택 뒤에는 가상 결과가 따라옵니다.</p></div><div class="card"><span class="num">03 / VERIFY</span><h3>고객의 결과 확인</h3><p>정상 지표 뒤에 남은 문제를 확인합니다. 완료를 선언하기 전 다음 담당자에게 남길 일을 정합니다.</p></div></div></div><section class="setup" id="setup"><div class="kicker">ENTER THE RECOVERY ROOM</div><h2>복구팀을 준비하세요.</h2><p class="muted">팀원은 역할 카드 4종을 나누어 읽고, 한 기기에서 대화하며 결정합니다.<br>혼자 시연할 때는 네 역할의 단서를 차례로 읽으면 됩니다.</p><form id="start-form"><div class="setup-fields"><label>팀 이름 <span class="smalltext">(실명 대신 별칭)</span><input name="team" placeholder="예: 복구팀 01" maxlength="24" autocomplete="off"></label><label>진행 모드<select name="mode"><option value="team">교육 모드 · 35분</option><option value="demo">짧은 시연 · 12분</option><option value="untimed">천천히 탐색 · 시간 제한 없음</option></select></label></div><p class="smalltext">정답 순위는 매기지 않습니다. 힌트는 감점 없이 사용할 수 있습니다. 진행 기록은 이 브라우저에만 저장됩니다. '+(state?'새 게임을 시작하면 기존 브라우저 기록을 새 세션으로 바꿉니다.':'')+'</p><div class="actions"><button type="submit" class="btn">게임 시작 <span aria-hidden="true">→</span></button><button type="button" class="btn secondary" data-nav="roles">역할 카드 보기</button><button type="button" class="btn ghost" data-action="downloadGame">게임 HTML 저장</button></div></form></section>'}
function topHTML(){const left=timeLeft(state,Date.now());return '<div class="game-top"><div><div class="label">RECOVERY TEAM / '+esc(state.team)+'</div><strong>'+state.stage+' / 5 미션 완료</strong></div><div class="timer-controls"><div><div class="label">'+(state.paused?'PAUSED':'TIME REMAINING')+'</div><div id="clock" class="timer '+(left!==null&&left<120?'low':'')+'" role="timer" aria-label="남은 시간">'+fmt(left)+'</div></div>'+(state.remaining!==null&&state.status==='playing'?'<button class="btn ghost small" data-action="pause">'+(state.paused?'재개':'일시정지')+'</button>':'')+'</div></div><div class="progress-track" role="progressbar" aria-label="미션 진행" aria-valuemin="0" aria-valuemax="5" aria-valuenow="'+state.stage+'"><div class="progress-fill" style="width:'+(state.stage*20)+'%"></div></div><div class="stage-list">'+missions.map(function(m,i){return '<span class="'+(i===state.stage?'active':i<state.stage?'done':'')+'">'+String(i+1).padStart(2,'0')+' '+m.label+'</span>'}).join('')+'</div>'}
function selectOptions(list,value){return '<option value="">선택하세요</option>'+list.map(function(x){return '<option value="'+x[0]+'" '+(value===x[0]?'selected':'')+'>'+x[1]+'</option>'}).join('')}
function formHTML(m,i){const d=draft(),opts=[['si','SI'],['ito','ITO'],['sw','차량 SW']];let t='';if(i===0)t='<div class="map-row"><span>고객 요구를 분석해 새 시스템 구축</span><select required aria-label="신규 시스템 업무" name="si">'+selectOptions(opts,d.si)+'</select></div><div class="map-row"><span>기존 서비스 감시와 장애 대응</span><select required aria-label="기존 서비스 업무" name="ito">'+selectOptions(opts,d.ito)+'</select></div><div class="map-row"><span>차량 소프트웨어 개발·검증</span><select required aria-label="차량 소프트웨어 업무" name="sw">'+selectOptions(opts,d.sw)+'</select></div><label style="margin-top:20px">서류함 잠금번호<input required pattern="[0-9]{3}" name="code" value="'+esc(d.code||'')+'" inputmode="numeric" maxlength="3" autocomplete="off" placeholder="3자리 숫자" aria-label="서류함 잠금번호"></label>';
if(i===2)t='<label>원인 가설<select required name="root">'+selectOptions([['cache','캐시 재사용 시간과 앱 표시 기준의 충돌'],['outage','서버 중단으로 요청 자체가 전혀 도착하지 않음'],['attack','확인되지 않은 외부 침입이 원인']],d.root)+'</select></label><label style="margin-top:20px">관련 설정 변경 시각<input required pattern="[0-9]{4}" name="code" value="'+esc(d.code||'')+'" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="HHMM · 4자리" aria-label="관련 설정 변경 시각"></label>';
if(i===1||i===3||i===4)t=m.choices.map(function(c){const check=i===4?(d.choices||[]).includes(c.id):d.choice===c.id;return '<label class="choice"><input type="'+(i===4?'checkbox':'radio')+'" name="'+(i===4?'choices':'choice')+'" value="'+c.id+'" '+(check?'checked':'')+'>'+c.title+'<span>'+c.desc+'</span></label>'}).join('');
return t+'<label style="margin-top:20px">판단 근거 메모 <span class="smalltext">(선택, 실제 개인정보 입력 금지)</span><textarea name="reason" maxlength="300" placeholder="어떤 단서로 판단했나요?">'+esc(d.reason||'')+'</textarea></label>'}
function gameHTML(){const i=state.stage,m=missions[i],r=roles[roleIndex],doc=m.docs[roleIndex],read=state.read[i],all=read.every(Boolean);return topHTML()+(state.paused?'<div class="note warn">타이머가 일시정지되어 있습니다. 읽기는 가능하며, 결정을 제출하려면 재개하세요.</div>':'')+'<div class="mission-header"><div class="kicker">MISSION '+String(i+1).padStart(2,'0')+' / '+m.label+'</div><h2 tabindex="-1">'+m.title+'</h2><p>'+m.story+'</p></div><div class="game-grid"><section><div class="role-tabs" role="tablist" aria-label="역할별 단서">'+roles.map(function(x,j){return '<button role="tab" aria-controls="evidence-panel" aria-selected="'+(j===roleIndex)+'" class="'+(j===roleIndex?'active':'')+'" data-role="'+j+'"><span>'+x.code+(read[j]?' ✓':'')+'</span>'+x.name+'</button>'}).join('')+'</div><div class="evidence" id="evidence-panel" role="tabpanel" aria-label="'+r.name+'의 단서"><header><p>'+doc.tag+' / '+r.code+'</p></header><h3>'+doc.title+'</h3><p>'+doc.text+'</p><div class="document">'+esc(doc.log)+'</div><div class="shareline"><span>팀에 공유 표시 '+read.filter(Boolean).length+' / 4</span><button class="btn small '+(read[roleIndex]?'secondary':'')+'" data-action="share" '+(read[roleIndex]?'disabled':'')+'>'+(read[roleIndex]?'공유 표시 완료':'이 단서를 팀에 공유했어요')+'</button></div></div><div class="game-sidebar"><h3>필요할 때 참고하세요</h3><details><summary>쉬운 용어 설명</summary><div class="glossary-grid"><p><b>SI</b> — 고객 요구에 맞춰 시스템을 설계하고 연결해 만드는 업무</p><p><b>ITO</b> — 서비스를 안정적으로 운영하고 상태·장애를 관리하는 업무</p><p><b>HTTP 200</b> — 요청에 성공 응답을 보냈다는 신호. 고객 기능의 정상 여부는 따로 확인</p><p><b>캐시</b> — 이전 데이터를 잠시 보관해 다시 사용하는 방식</p><p><b>단계 적용</b> — 일부 범위에서 확인한 뒤 적용 범위를 넓히는 방식</p><p><b>인수인계</b> — 다음 사람이 남은 문제를 이어 처리할 수 있게 정보를 전달하는 일</p></div></details><div class="hintbox"><button class="btn ghost small" data-action="hint" '+(state.hints[i]>=2?'disabled':'')+'>'+(state.hints[i]===0?'힌트 열기':state.hints[i]===1?'다음 힌트':'힌트 2개 열람')+'</button><span class="smalltext"> 감점 없이 사용</span>'+m.hints.slice(0,state.hints[i]).map(function(t,j){return '<p>힌트 '+(j+1)+'. '+t+'</p>'}).join('')+'</div><p class="smalltext">열람·공유 표시는 실제 협업 평가가 아닙니다. 판단 이유는 종료 후 함께 설명해주세요.</p></div></section><aside><div class="decision"><div class="kicker">TEAM DECISION</div><h3>'+ (i===4?'마지막 조치 세 가지':'팀의 판단을 입력하세요')+'</h3><p class="brief">'+m.task+'</p><form id="mission-form">'+formHTML(m,i)+'<p class="gating">'+(!all?'네 역할의 단서를 공유하면 제출할 수 있습니다.':state.paused?'타이머 재개 후 제출할 수 있습니다.':'네 역할의 단서가 모였습니다. 근거를 확인하고 결정하세요.')+'</p><button type="submit" class="btn" style="width:100%;margin-top:10px" '+(!all||state.paused?'disabled':'')+'>'+(i===4?'최종 결과 확인':i===0||i===2?'잠금 해제':'이 대응으로 진행')+'</button></form></div><div class="game-sidebar"><h3>복구 기록</h3><ul class="ledger">'+(state.history.length?state.history.slice(-3).map(function(h){return '<li>미션 '+(h.mission+1)+' / '+esc(h.event)+'<br>'+esc(h.text)+'</li>'}).join(''):'<li>아직 결정한 기록이 없습니다.</li>')+'</ul></div></aside></div>'}
function feedbackHTML(){return topHTML()+'<section class="setup" style="max-width:850px;margin:38px auto"><div class="kicker">DECISION CONSEQUENCE / MISSION '+(feedback.mission+1)+'</div><h2 tabindex="-1">'+(feedback.advance?(feedback.correct?'단서를 연결했습니다.':'선택의 결과가 도착했습니다.'):'잠금이 풀리지 않았습니다.')+'</h2><div class="note '+(feedback.correct?'':feedback.advance?'warn':'error')+'">'+esc(feedback.message)+'</div><p class="muted">팀 대화: 이 판단에서 확인한 사실은 무엇이었고, 아직 확인하지 못한 것은 무엇인가요?</p><p class="smalltext">이 결과는 가상 시나리오의 피드백입니다. 실제 시스템 조치나 회사 지침이 아닙니다.</p><button class="btn" data-action="next">'+(feedback.advance?(state.stage===5?'엔딩과 학습 기록 보기':'다음 미션으로'):'단서 다시 확인')+' <span aria-hidden="true">→</span></button></section>'}
function resultHTML(){const e=ending(state),score=state.firstPoints.reduce(function(a,v){return a+(v||0)},0),names=['사업 구분','영향 판단','근거 연결','복구 계획','고객 결과 확인'];return '<div class="result"><div class="kicker">'+e.tag+'</div><h1 tabindex="-1">'+e.title+'</h1><p class="hero-lead">'+e.desc+'</p><div class="note '+(e.tone==='good'?'':e.tone)+'"><b>'+esc(state.team)+'</b> / '+(state.mode==='team'?'35분 교육':state.mode==='demo'?'12분 시연':'시간 제한 없음')+' / '+state.stage+'개 미션 완료<br>이 결과는 가상 상황에서 선택한 판단에 대한 피드백이며 실제 교육 성과나 업무 역량 평가가 아닙니다.</div><div class="grid2"><div class="card"><div class="kicker">FIRST DECISION RECORD</div><h3>첫 판단 기록</h3><div class="score">'+score+'<span class="muted" style="font-size:20px"> / 20</span></div><p>각 미션의 첫 제출을 기록합니다. 잠금을 다시 풀어 완료해도 첫 판단 기록은 바뀌지 않습니다. 힌트 사용과 시간은 감점하지 않습니다.</p>'+names.map(function(n,i){const p=state.firstPoints[i];return '<div class="dimension">'+n+'<span>'+(p===null?'미응답':p+' / 4')+'</span><div class="bar"><i style="width:'+((p||0)*25)+'%"></i></div></div>'}).join('')+'</div><div class="card"><div class="kicker">LEARNING REVIEW</div><h3>결정 뒤에 남은 질문</h3><p>서버가 정상이라는 신호와 고객이 정상적으로 사용하는 것은 어떻게 달랐나요?</p><p>다른 역할의 단서가 내 판단을 바꾼 장면은 무엇이었나요?</p><p>지금 실제로 모르는 일이 생기면 누구에게 어떤 정보로 질문하겠어요?</p><label>개인·팀 회고 <span class="smalltext">(실명·실제 고객 정보 제외)</span><textarea id="reflection" maxlength="1200" placeholder="다음에 확인할 사실, 도움을 요청할 대상, 남길 기록">'+esc(state.reflection||'')+'</textarea></label><p class="smalltext">공유 표시 '+state.read.reduce(function(a,v){return a+v.filter(Boolean).length},0)+'회 / 힌트 '+state.hints.reduce(function(a,v){return a+v},0)+'회 / 잠금 재검토 '+Math.max(0,state.attempts[0]-1)+', '+Math.max(0,state.attempts[2]-1)+'회<br>클릭 수는 실제 발언이나 협업 수준을 의미하지 않습니다.</p></div></div><div class="actions"><button class="btn" data-nav="quiz">5문항 학습 확인</button><button class="btn secondary" data-action="export">결과 JSON 저장</button><button class="btn secondary" data-nav="guide">디브리핑 질문 보기</button><button class="btn ghost" data-nav="home">새 게임 준비</button></div><div class="learning"><h2>우리 팀의 선택 이력</h2>'+state.history.map(function(h){return '<details><summary>미션 '+(h.mission+1)+' / '+esc(h.event)+(h.points!==undefined?' / 해당 제출 '+h.points+'점':'')+'</summary><p>'+esc(h.text)+'</p>'+(h.answer&&h.answer.reason?'<p><b>팀 메모:</b> '+esc(h.answer.reason)+'</p>':'')+'</details>'}).join('')+'</div></div>'}
function rolesHTML(){return '<div class="doc"><div class="kicker">ROLE SHEETS / 4 PERSPECTIVES</div><h1>네 개의 역할 카드</h1><div class="note warn">전체 미션의 단서가 담겨 있습니다. 팀원에게 역할별로 한 장씩 나눠주세요. 실제 부서명이 아닌 교육용 관점입니다.</div><div class="actions no-print"><button class="btn" data-action="print">역할 카드 인쇄</button><button class="btn secondary" data-nav="home">게임 준비로</button></div>'+roles.map(function(r,i){return '<section class="role-sheet"><div class="kicker">'+r.code+'</div><h3>'+r.name+'</h3><p>'+r.desc+' 내 단서를 설명한 뒤, 다른 역할에서 필요한 정보도 질문하세요.</p>'+missions.map(function(m,j){const d=m.docs[i];return '<h4>미션 '+(j+1)+' · '+m.label+'</h4><p>'+d.text+'</p><pre>'+esc(d.log)+'</pre>'}).join('')+'</section>'}).join('')+'</div>'}
function quizHTML(){const result=state&&state.quiz||standaloneQuiz;return '<div class="doc"><div class="kicker">LEARNING CHECK / 5 QUESTIONS</div><h1>새 질문으로 확인하세요.</h1><p class="intro">개인별로 답해보세요. 이 짧은 확인은 교육 효과를 검증하는 사전·사후 검사지와는 별도입니다.</p>'+(result?'<div class="note"><b>'+result.score+' / 5 정답</b><br>오답 해설을 읽고 어떤 기준을 다시 확인할지 기록해보세요.</div>':'')+'<form id="quiz-form">'+quiz.map(function(q,i){return '<fieldset class="quiz-q" style="border-left:0;border-right:0;border-top:0"><legend>'+ (i+1)+'. '+q.q+'</legend>'+q.options.map(function(t,j){return '<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'" '+(result&&result.answers[i]===j?'checked':'')+' required>'+esc(t)+'</label>'}).join('')+(result?'<p class="smalltext"><b>'+(result.answers[i]===q.correct?'정답':'다시 확인')+'</b> — '+q.why+'</p>':'')+'</fieldset>'}).join('')+'<button class="btn" type="submit">답 확인</button> <button class="btn secondary" type="button" data-nav="game">게임·결과로</button></form></div>'}
function download(name,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime||'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function downloadGame(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';const to=clone.querySelector('#toast');if(to)to.remove();download('day-zero-game.html','<!DOCTYPE html>\n'+clone.outerHTML,'text/html;charset=utf-8');toast('단일 HTML 게임 파일을 저장했습니다. 내려받은 파일은 인터넷 없이 열 수 있습니다.')}
function exportResult(){if(!state){toast('먼저 게임을 시작해주세요.');return}const txt=document.getElementById('reflection');if(txt)state.reflection=txt.value;capture();save();const out={program:'DAY ZERO',proposal:'미실행 HRD 프로그램 제안 / 가상 교육 상황',exportedAt:new Date().toISOString(),team:state.team,mode:state.mode,status:state.status,completedMissions:state.stage,firstDecisionPoints:state.firstPoints,attempts:state.attempts,hints:state.hints,sharedMarkers:state.read,recordCaution:'공유 클릭은 실제 협업 수행의 증거가 아니며 게임 점수는 업무 역량 평가가 아님',decisions:state.decisions,history:state.history,knowledgeCheck:state.quiz,reflection:state.reflection};download('day-zero-result.json',JSON.stringify(out,null,2),'application/json;charset=utf-8');toast('결과 기록을 저장했습니다.')}
document.getElementById('app').addEventListener('submit',function(ev){ev.preventDefault();const form=ev.target;if(form.id==='start-form'){const f=new FormData(form);state=fresh(String(f.get('mode')),String(f.get('team')||'복구팀 01').trim().slice(0,24),Date.now());feedback=null;roleIndex=0;save();navigate('game');return}if(form.id==='mission-form'){capture();const d=draft(),r=solve(state,d,Date.now());save();if(r.timeout){feedback=null;render();return}if(!r.ok){toast(r.message);return}feedback=r;roleIndex=0;render();window.scrollTo(0,0);return}if(form.id==='quiz-form'){const f=new FormData(form),answers=quiz.map(function(q,i){return Number(f.get('q'+i))}),result={score:answers.filter(function(v,i){return v===quiz[i].correct}).length,answers:answers,at:Date.now()};if(state){state.quiz=result;save()}else standaloneQuiz=result;render();window.scrollTo(0,0);}});
document.addEventListener('click',function(ev){const b=ev.target.closest('button');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.role!==undefined){capture();roleIndex=Number(b.dataset.role);save();render();return}const a=b.dataset.action;if(a==='share'&&state&&state.stage<5){capture();state.read[state.stage][roleIndex]=true;save();render()}if(a==='hint'&&state&&state.stage<5){capture();state.hints[state.stage]=Math.min(2,state.hints[state.stage]+1);save();render()}if(a==='pause'&&state){capture();pauseState(state,Date.now());save();render()}if(a==='next'){feedback=null;render();window.scrollTo(0,0)}if(a==='print'){window.print()}if(a==='downloadGame')downloadGame();if(a==='downloadGuide'){const plain=GUIDE.replace(/<\/(p|h1|h2|h3|li|summary|td|th|tr|div|section)>/g,'\n\n').replace(/<[^>]+>/g,'').replace(/\n{3,}/g,'\n\n');download('day-zero-facilitator-guide.txt',plain);toast('운영 가이드 텍스트를 저장했습니다.')}if(a==='export')exportResult();});
document.addEventListener('keydown',function(e){if(!e.target.closest('.role-tabs'))return;let n=roleIndex;if(e.key==='ArrowRight')n=(roleIndex+1)%4;else if(e.key==='ArrowLeft')n=(roleIndex+3)%4;else if(e.key==='Home')n=0;else if(e.key==='End')n=3;else return;e.preventDefault();capture();roleIndex=n;save();render();const b=document.querySelector('[data-role="'+n+'"]');if(b)b.focus()});
document.addEventListener('input',function(e){if(e.target.id==='reflection'&&state){state.reflection=e.target.value;save()}});
window.addEventListener('hashchange',function(){const v=location.hash.slice(1);if(['home','game','proposal','guide','roles','quiz'].includes(v)){view=v;feedback=null;render();window.scrollTo(0,0)}});
window.addEventListener('beforeunload',function(){capture();save()});
setInterval(function(){if(!state||state.status!=='playing')return;if(expire(state,Date.now())){feedback=null;view='game';history.replaceState(null,'','#game');save();render();window.scrollTo(0,0);return}const t=document.getElementById('clock');if(t){const l=timeLeft(state,Date.now());t.textContent=fmt(l);t.classList.toggle('low',l!==null&&l<120)}},1000);
const hash=location.hash.slice(1);view=['home','game','proposal','guide','roles','quiz'].includes(hash)?hash:'home';if(state&&expire(state,Date.now()))save();render();
</script></body></html>
