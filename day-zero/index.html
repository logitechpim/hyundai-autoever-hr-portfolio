</style></head><body><a class="skip" href="#app">본문으로 이동</a><header><div class="wrap header-inner"><button class="brand" data-nav="home" aria-label="DAY ZERO 시작 화면">DAY <b>ZERO</b><span aria-hidden="true"> _</span></button><nav aria-label="주 메뉴"><button data-nav="game">게임 플레이</button><button data-nav="proposal">HRD 기획</button><button data-nav="guide">운영 가이드</button></nav></div></header><div class="proposal"><div class="wrap"><b>현대오토에버 신입사원 온보딩</b> · 개인 기획안 · 미실행</div></div><main id="app" class="wrap"></main><footer><div class="wrap">DAY ZERO · 기획 이준호 · 2026</div></footer><noscript>이 게임을 플레이하려면 브라우저에서 JavaScript를 활성화해주세요.</noscript><script>const roles=[{"code":"OPS","name":"운영 담당","desc":"서비스 상태와 고객 영향을 확인합니다."},{"code":"BUILD","name":"구축 담당","desc":"변경 기록과 시스템 연결을 확인합니다."},{"code":"CHECK","name":"차량·품질 담당","desc":"고객 기능과 검증 기준을 확인합니다."},{"code":"LINK","name":"고객 지원 담당","desc":"고객 안내와 협업 요청을 정리합니다."}];
const missions=[{"id":"map","title":"관련 업무를 찾아 연결하세요","label":"업무 구분","story":"예약 조회 장애가 접수됐습니다. 세 업무 자료를 읽고, 필요한 담당을 순서대로 연결하세요.","task":"업무를 구분한 뒤 안내된 순서대로 서류함 번호를 입력하세요.","learning":"SI·ITO·차량 SW의 역할을 사례로 구분합니다.","docs":[{"tag":"DOCUMENT O-01","title":"운영 인수 메모","text":"새 시스템을 만든 뒤에는 서비스를 안정적으로 운영하고 장애에 대응합니다. 이번 접수는 운영 화면에서 시작됐습니다.","log":"서류함 2\n업무: 기존 서비스 상태 감시, 장애 대응, 운영\n분류: ITO (IT Outsourcing)"},{"tag":"DOCUMENT B-01","title":"시스템 구축 계약","text":"고객 요구를 분석하고 시스템을 설계·연결해 구축합니다. 변경 이슈가 의심되면 구축 담당과 함께 확인합니다.","log":"서류함 4\n업무: 고객 요구 분석, 시스템 설계와 통합 구축\n분류: SI (System Integration)"},{"tag":"DOCUMENT Q-01","title":"차량 SW 검증 계획","text":"차량 소프트웨어와 서버 서비스는 연결되어 있습니다. 고객 기능을 확인할 때 차량·품질 기준도 살핍니다.","log":"서류함 7\n업무: 차량 소프트웨어 개발과 검증\n분류: 차량 SW"},{"tag":"DOCUMENT L-01","title":"서류함 안내","text":"서류함 번호를 구축 → 운영 → 차량 SW 순서로 연결하세요.","log":"순서: 구축 → 운영 → 차량 SW\n번호 세 개를 이어 입력하세요."}],"hints":["새 시스템을 만드는 일과 기존 서비스를 운영하는 일을 구분하세요.","SI는 4번, ITO는 2번, 차량 SW는 7번입니다. 안내된 순서대로 입력하세요."]},{"id":"triage","title":"고객에게 어떤 영향이 있나","label":"고객 영향","story":"09:15. 예약 내역이 보이지 않는다는 문의가 들어왔습니다. 서버는 응답하지만 원인은 아직 확인되지 않았습니다.","task":"확인된 사실에 따라 첫 대응을 고르세요.","learning":"사실과 추측을 구분하고, 영향 범위와 협업 요청을 정합니다.","docs":[{"tag":"SIGNAL O-02","title":"서버 상태 화면","text":"서버는 정상 응답하지만 예약 확인 화면에 오류가 접수됐습니다. 전체 서비스가 중단됐다고 볼 근거는 없습니다.","log":"09:10 상태 확인: 정상\n09:12 예약 조회 이상 감지\n09:15 예약을 했는데 앱에서 보이지 않음\n확인된 영향: 충전예약 조회"},{"tag":"CHANGE B-02","title":"담당자 메시지","text":"최근 설정 변경 기록이 있습니다. 무엇이 바뀌었는지 개발 담당이 확인할 수 있습니다. 정상 지표만 보고 고객 문제를 종료할 수는 없습니다.","log":"09:12 설정 변경 기록 존재\n변경 내용: 확인 중\n요청 가능한 일: 변경 전후 비교, 가설 확인"},{"tag":"SCOPE Q-02","title":"검증 범위 메모","text":"현재 확인된 문제는 예약 조회입니다. 차량 제어 기능에 이상이 있다는 근거는 없습니다.","log":"차량 제어 기능: 이상 신고 없음\n예약 조회: 추가 확인 필요"},{"tag":"CUSTOMER L-02","title":"고객 지원 요청","text":"고객에게는 발생 시각과 증상을 알립니다. 이름과 연락처는 공유하지 않습니다.","log":"공유할 내용: 발생 시각, 예약 증상, 익명 사례\n공유하지 않을 내용: 고객 이름과 연락처\n다음 안내: 09:25"}],"choices":[{"id":"contain","title":"예약 조회 영향을 줄이고 관련 담당자를 연결한다","desc":"확인된 증상과 다음 안내 시각을 공유한다.","feedback":"예약 조회 문제를 확인하고 운영·개발·검증·고객 담당을 연결했습니다. 다음 안내 시각을 정하고 최근 변경 기록을 확인하세요.","points":4},{"id":"deny","title":"서버가 정상이므로 고객의 사용 실수로 안내한다","desc":"장애 대응은 멈추고 앱 재설치를 요청한다.","feedback":"예약 문의가 다시 들어왔습니다. 서버 응답과 고객 화면을 각각 확인하고 관련 담당자를 연결하세요.","points":0},{"id":"broadcast","title":"모든 기능이 중단됐다고 알리고 문의 원문을 공유한다","desc":"영향 범위와 개인정보를 확인하기 전에 넓게 알린다.","feedback":"확인되지 않은 범위와 고객 정보가 공유됐습니다. 안내 범위를 바로잡고 필요한 정보만 전달하세요.","points":0}],"hints":["서버 응답과 고객 화면을 따로 확인하세요.","문제 범위를 좁히고 필요한 담당자를 연결하세요. 고객 이름과 연락처는 공유하지 않습니다."]},{"id":"trace","title":"원인이 된 변경 찾기","label":"원인 찾기","story":"관리 화면은 정상입니다. 변경 기록과 앱의 표시 기준을 비교해 예약이 보이지 않는 이유를 찾아보세요.","task":"가장 근거 있는 원인을 고르고, 변경 시각을 입력하세요.","learning":"여러 역할의 자료를 연결해 원인과 근거를 설명합니다.","docs":[{"tag":"LOG O-03","title":"운영 조회 기록","text":"서버는 응답하고 있지만 앱은 그 응답을 받아 표시하지 않습니다. 연결이 끊겼다고만 설명하면 이 차이를 놓칩니다.","log":"09:11 예약 조회: HTTP 200, 데이터 나이 12초\n09:13 예약 조회: HTTP 200, 데이터 나이 65초\nHTTP 200 = 요청 처리 응답. 고객 기능의 정상 여부는 별도 확인."},{"tag":"LOG B-03","title":"변경 이력","text":"서버가 전에 조회한 결과를 다시 쓰는 시간을 늘렸습니다. 캐시는 이전 데이터를 잠시 보관하는 방식입니다.","log":"09:08 화면 문구 수정\n09:12 조회 캐시 재사용 시간: 20초 → 80초\n09:14 담당자 메모 저장\n서버 증설/중단 기록: 없음"},{"tag":"RULE Q-03","title":"앱의 유효성 기준","text":"앱은 30초보다 오래된 예약 결과를 표시하지 않습니다. 응답 상태와 데이터가 최신인지 함께 확인합니다.","log":"앱 표시 기준: 데이터 나이 30초 이하\n09:13 수신 데이터: 65초 경과 → 표시하지 않음\n차량 제어 SW 변경: 없음"},{"tag":"CLUE L-03","title":"첫 신고 타임라인","text":"화면 문구 변경은 예약이 보이지 않는 증상을 설명하지 못합니다. 변경 기록과 앱의 기준을 비교하세요.","log":"09:11 정상 표시 확인\n09:13 첫 예약 미표시 신고\n입력할 값: 원인과 관련된 변경 시각 HHMM"}],"hints":["앱이 오래된 데이터를 표시하지 않는 기준을 확인하세요.","캐시는 80초, 앱 기준은 30초입니다. 설정 변경 시각은 09:12입니다."]},{"id":"restore","title":"어떻게 복구할까","label":"복구 계획","story":"원인 후보를 찾았습니다. 고객 안내 시각이 다가옵니다. 적용 범위와 확인 방법을 정하세요.","task":"검증, 승인, 고객 영향과 중단 조건을 살펴 복구 계획을 고르세요.","learning":"검증·승인·단계 적용·중단 조건을 포함해 복구 계획을 판단합니다.","docs":[{"tag":"PLAN O-04","title":"운영 담당의 조건","text":"다시 문제가 생기면 적용을 멈추고 승인된 이전 설정으로 되돌릴 수 있어야 합니다. 상태 감시를 끄면 악화를 놓칠 수 있습니다.","log":"필요 조건: 상태 감시 / 영향 확인 / 중단 기준\n중단 기준: 예약 표시 실패가 다시 확인됨"},{"tag":"PLAN B-04","title":"개발 담당의 수정안","text":"승인된 이전 설정은 캐시 재사용 20초입니다. 수정안을 검증 환경에서 확인한 뒤 일부 이용 범위부터 적용할 수 있습니다.","log":"확인할 설정: 캐시 20초\n적용: 일부 범위에서 확인한 뒤 확대"},{"tag":"PLAN Q-04","title":"복구 확인 목록","text":"성공 응답만 확인하면 같은 문제가 다시 남을 수 있습니다. 고객이 예약 결과를 볼 수 있는지와 데이터 나이를 함께 확인해야 합니다.","log":"[ ] HTTP 응답 확인\n[ ] 데이터 나이 30초 이하\n[ ] 앱에서 예약 결과 표시\n[ ] 이상 발생 시 적용 중단·되돌림"},{"tag":"PLAN L-04","title":"고객 안내 초안","text":"확인 중인 원인과 조치 상태를 구분해 말합니다. 검증이 끝나기 전에 ‘완전 복구’라고 알리지 않습니다.","log":"안내 예시: 예약 조회 이상을 확인했습니다.\n설정을 조정하고 있습니다. 확인 후 다시 안내하겠습니다."}],"choices":[{"id":"staged","title":"이전 설정을 검증하고 승인 후 일부 범위부터 적용한다","desc":"고객 기능을 확인하면서 단계적으로 확대하고, 이상 시 중단한다.","feedback":"이전 설정을 확인하고 일부 범위에 적용해 예약 조회를 확인했습니다. 이제 실제 예약 기록도 맞는지 살펴보세요.","points":4},{"id":"fast","title":"즉시 전체 재시작하고 상태 감시는 잠시 끈다","desc":"성공 응답만 확인한 뒤 복구 완료를 알린다.","feedback":"전체 재시작으로 조회는 돌아왔지만 기록 확인과 검증이 빠졌습니다. 성급한 완료 안내도 바로잡아야 합니다.","points":0},{"id":"hold","title":"문제 기능 이용을 제한하고 검증과 승인부터 확보한다","desc":"일부 불편을 감수하며 안내를 유지하고, 확인 후 조치를 적용한다.","feedback":"영향을 줄이고 검증을 확보하는 계획입니다. 제한으로 생긴 고객 불편과 다음 확인 시점을 함께 안내해야 합니다. 제한을 해제할 기준도 필요합니다.","points":3}],"hints":["기능 검증과 되돌릴 조건이 있는 계획을 고르세요.","일부 범위부터 적용하고, 이상이 생기면 중단하는 방법이 있습니다."]},{"id":"verify","title":"예약이 제대로 돌아왔나","label":"최종 확인","story":"09:24. 예약 조회가 돌아왔습니다. 그런데 고객에게 확인 메시지가 두 번 갔습니다. 조회뿐 아니라 예약 기록도 확인하세요.","task":"고객 예약을 확인하고, 필요한 후속 조치 세 가지를 고르세요.","learning":"고객 결과를 확인하고 남은 문제와 후속 담당자를 기록합니다.","docs":[{"tag":"RESULT O-05","title":"복구 직후 대시보드","text":"조회 상태는 돌아왔습니다. 그러나 신규 예약 기록에는 같은 요청에서 비롯된 중복 항목이 있습니다. 상태 지표만으로 종료하면 누락됩니다.","log":"HTTP 응답: 정상\n데이터 나이: 15초\n예약 요청 R-87: 확인 기록 2건\n조회 복구와 기록 확인은 별개"},{"tag":"RESULT B-05","title":"재시도 요청 기록","text":"이용자가 예약 버튼을 다시 눌러 요청이 재시도됐습니다. 같은 요청이 두 번 처리되지 않도록 확인해야 합니다.","log":"요청 R-87 / 재시도 1회\n동일 요청의 기록 2건 발견\n필요: 원본 보존, 중복 여부 확인, 담당 승인 아래 정정\n조치: 원인을 추측해 기록을 바로 지우지 않는다."},{"tag":"RESULT Q-05","title":"고객 기능 최종 확인","text":"요청 한 건에 예약 기록 한 건이 남았는지 확인합니다. 기록을 정정한 뒤 고객 화면과 처리 내역을 다시 살펴보세요.","log":"최종 기준: 고객 요청 1개에 유효한 예약 1개\n후속 검증: 중복 방지 / 정상 예약 표시 / 정정 이력\n인수인계: 남은 항목, 담당자, 다음 확인 시점"},{"tag":"RESULT L-05","title":"새로 도착한 고객 메시지","text":"복구 상태와 다음 조치를 고객에게 알립니다. 관련 담당자에게 필요한 정보만 전달하세요.","log":"고객 메시지: 예약 확인이 두 개 왔어요.\n공유 정보: 익명 요청 ID R-87, 중복 증상, 처리 상태\n개인정보 원문은 추가로 공유할 필요 없음."}],"choices":[{"id":"reconcile","title":"해당 요청을 보존하고 담당자와 기록을 대조한다","desc":"다른 정상 기능의 이용을 불필요하게 중단하지 않는다."},{"id":"retest","title":"승인된 정정 후 고객 화면과 중복 방지를 다시 확인한다","desc":"고객이 실제로 얻는 예약 결과를 확인한다."},{"id":"handover","title":"영향, 조치, 남은 일과 다음 안내 시각을 기록한다","desc":"필요한 정보만 공유하고 고객에게 상태를 알린다."},{"id":"erase","title":"중복으로 보이는 기록을 즉시 삭제하고 완료 공지를 낸다","desc":"담당 승인과 원본 확인을 생략한다."},{"id":"ignore","title":"초록색 상태 화면을 근거로 문의를 종료한다","desc":"고객 결과 확인은 다음 근무자에게 맡긴다."}],"hints":["예약 조회가 정상이어도 예약 기록이 맞다는 뜻은 아닙니다.","기록 대조, 정정 후 재확인, 다음 담당자에게 인계하세요."]}];

const PROPOSAL="<div class=\"doc\">\n<div class=\"kicker\">DAY ZERO / 프로그램 기획안</div>\n<h1>첫날, 함께 장애를 해결하며<br>우리 업무를 익힙니다.</h1>\n<p class=\"intro\">신입사원 4명이 역할별 단서를 모아 예약 장애를 해결하는 75분 온보딩 활동입니다. 회사의 사업과 부서 간 협업을 게임으로 익힙니다.</p>\n<div class=\"actions no-print\"><button class=\"btn\" data-nav=\"game\">게임 시작</button><button class=\"btn secondary\" data-nav=\"guide\">진행자 안내</button><button class=\"btn ghost\" data-action=\"print\">기획안 인쇄</button></div>\n<h2>기획 배경</h2>\n<p>현대오토에버는 차량 SW부터 IT 구축·운영까지 여러 사업을 합니다. 이 프로그램은 고객의 예약 장애를 해결하며 각 업무가 어떻게 연결되는지 살펴보도록 기획했습니다.</p>\n<p>운영·구축·차량·고객 역할마다 다른 단서를 제공합니다. 팀은 정보를 모아 원인을 찾고, 복구 뒤 고객 예약까지 확인합니다.</p>\n<h2>대상과 교육 목표</h2>\n<div class=\"grid3\"><div class=\"card\"><span class=\"num\">대상</span><h3>신입사원 24명</h3><p>4명씩 6개 팀. 개발 경험이 없어도 참여할 수 있습니다.</p></div><div class=\"card\"><span class=\"num\">시점</span><h3>회사 소개 이후</h3><p>공통 온보딩에서 사업 간 연결을 익힙니다.</p></div><div class=\"card\"><span class=\"num\">목표</span><h3>근거를 말하는 협업</h3><p>단서를 공유하고, 필요한 담당자에게 확인을 요청합니다.</p></div></div>\n<div class=\"table-scroll\"><table><thead><tr><th>학습 목표</th><th>기대 행동</th><th>확인 방법</th></tr></thead><tbody><tr><td>사업 이해</td><td>SI, ITO, 차량 SW를 사례에 맞게 구분한다.</td><td>사전·사후 문항</td></tr><tr><td>근거에 따른 판단</td><td>두 가지 이상의 단서로 원인과 영향을 설명한다.</td><td>미션 2·3 관찰</td></tr><tr><td>협업 요청</td><td>필요한 담당자와 확인할 내용을 구체적으로 말한다.</td><td>팀 토론 관찰</td></tr><tr><td>고객·품질 확인</td><td>복구 뒤 고객 결과와 남은 일을 확인해 인계한다.</td><td>미션 4·5, 인수인계문</td></tr></tbody></table></div>\n<h2>75분 운영안</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>시간</th><th>활동</th><th>내용</th></tr></thead><tbody><tr><td>5분</td><td>사전 문항</td><td>업무 구분과 장애 대응 기준 확인</td></tr><tr><td>10분</td><td>안내와 역할 배정</td><td>상황, 용어, 진행 방법 안내</td></tr><tr><td>35분</td><td>게임</td><td>5개 미션을 팀으로 해결</td></tr><tr><td>20분</td><td>디브리핑</td><td>선택의 근거와 다음 업무 적용 토론</td></tr><tr><td>5분</td><td>사후 문항·회고</td><td>배운 내용 확인, 개인 적용점 기록</td></tr><tr><td><strong>총 75분</strong></td><td colspan=\"2\">35분 게임 모드 기준. 12분 시연과 자유 플레이도 제공.</td></tr></tbody></table></div>\n<h2>5개 미션</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>미션</th><th>진행</th><th>학습 내용</th></tr></thead><tbody><tr><td>1. 업무 구분 · 5분</td><td>업무 자료를 분류하고 암호를 푼다.</td><td>SI, ITO, 차량 SW의 역할</td></tr><tr><td>2. 고객 영향 · 6분</td><td>문의와 운영 정보를 보고 첫 대응을 고른다.</td><td>사실 확인, 영향 범위, 정보 공유</td></tr><tr><td>3. 원인 찾기 · 8분</td><td>변경 기록과 앱 기준을 연결한다.</td><td>단서를 모아 원인 가설 설명</td></tr><tr><td>4. 복구 계획 · 7분</td><td>복구 방안을 비교해 하나를 선택한다.</td><td>검증, 승인, 단계 적용, 중단 조건</td></tr><tr><td>5. 최종 확인 · 9분</td><td>중복 예약을 발견하고 후속 조치를 고른다.</td><td>고객 결과와 인수인계</td></tr></tbody></table></div>\n<h2>운영 준비</h2>\n<p><strong>인력:</strong> 진행자 1명, 관찰·지원 담당 2명. 한 관찰자가 3개 팀을 맡습니다.</p>\n<ul><li>팀별 노트북 1대, 화면, 역할 카드 4장, 메모지와 필기구</li><li>진행자용 정답표, 관찰표, 게임 파일. 인터넷 문제에 대비해 HTML 파일을 미리 저장합니다.</li><li>팀원은 역할 카드 한 장씩 맡습니다. 입력 담당은 미션마다 바꿉니다.</li><li>시간 제한 없이 진행하거나 화면을 확대할 수 있습니다. 필요하면 역할 카드를 함께 읽습니다.</li></ul>\n<h2>예산 예시</h2>\n<p>24명 1회 운영 기준입니다. 사내 공간과 기존 노트북을 사용한다고 가정했습니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>항목</th><th>산출 기준</th><th>금액</th></tr></thead><tbody><tr><td>역할 카드·인쇄물</td><td>24명 × 500원</td><td>12,000원</td></tr><tr><td>팀별 필기구</td><td>6팀 × 3,000원</td><td>18,000원</td></tr><tr><td>다과</td><td>24명 × 5,000원</td><td>120,000원</td></tr><tr><td>예비비</td><td>직접비의 10%</td><td>15,000원</td></tr><tr><td><strong>직접비</strong></td><td>1인당 6,875원</td><td><strong>165,000원</strong></td></tr><tr><td>당일 운영 공수</td><td>3명 × 2시간 × 50,000원</td><td>300,000원</td></tr><tr><td><strong>1회 운영비</strong></td><td>직접비 + 운영 공수</td><td><strong>465,000원</strong></td></tr><tr><td>초기 설계·구현</td><td>48시간 × 50,000원</td><td>2,400,000원</td></tr></tbody></table></div>\n<p class=\"smalltext\">초기 설계 공수와 단가는 예산 검토를 위한 가정입니다. 공간 대관, 기기 대여, 참가자 인건비는 포함하지 않았습니다.</p>\n<h2>효과 확인</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>시점</th><th>확인 내용</th><th>방법</th></tr></thead><tbody><tr><td>시작·종료</td><td>업무 구분과 판단 기준의 변화</td><td>개인별 5문항 비교</td></tr><tr><td>게임 중</td><td>단서 공유, 근거 설명, 구체적 요청, 인수인계</td><td>관찰표 0~2점</td></tr><tr><td>2주 뒤</td><td>업무에서 도움을 요청한 상황과 적용점</td><td>참여자·멘토 회고</td></tr></tbody></table></div>\n<p><strong>파일럿 목표:</strong> 참가자의 80% 이상이 사후 5문항 중 4문항 이상 정답, 네 역할 모두 한 번 이상 발언, 디브리핑 20분 진행. 만족도와 학습 결과는 따로 확인합니다.</p>\n<h2>도입 전 확인</h2>\n<ol><li>현업 담당자와 사업 설명, 협업 창구, 복구 판단 기준을 검토합니다.</li><li>4~8명에게 미션 이해도와 진행 시간을 확인하고 수정합니다.</li><li>24명 파일럿 뒤 사전·사후 문항과 관찰 결과를 보고 운영 여부를 판단합니다.</li></ol>\n<h2>참고 자료</h2>\n<ul><li><a href=\"https://www.hyundai-autoever.com/kor/main/index.do\" target=\"_blank\" rel=\"noopener\">현대오토에버 사업 소개</a></li><li><a href=\"https://career.hyundai-autoever.com/ko/servicesw\" target=\"_blank\" rel=\"noopener\">현대오토에버 Service SW 직무 소개</a></li><li><a href=\"https://www.hyundai-autoever.com/kor/business-area/in-vehicle-it/edge-cloud-computing/contents.do?cntnSeq=348\" target=\"_blank\" rel=\"noopener\">차량 연동 서비스</a></li><li><a href=\"https://www.hyundai-autoever.com/kor/business-area/digital-transformation/sdf/contents.do?cntnSeq=455\" target=\"_blank\" rel=\"noopener\">스마트팩토리</a></li></ul>\n</div>";
const GUIDE="<div class=\"doc\">\n<div class=\"kicker\">DAY ZERO / 진행자 안내</div>\n<h1>게임 진행 가이드</h1>\n<p class=\"intro\">4명 한 팀, 35분 플레이, 20분 디브리핑 기준입니다. 정답을 먼저 알려주기보다 팀이 단서와 판단 근거를 나누도록 도와주세요.</p>\n<div class=\"note warn\"><b>정답 포함</b><br>참가자에게는 게임 전에 이 페이지를 공유하지 마세요.</div>\n<div class=\"actions no-print\"><button class=\"btn\" data-action=\"print\">가이드 인쇄</button><button class=\"btn secondary\" data-nav=\"roles\">역할 카드</button><button class=\"btn ghost\" data-action=\"downloadGuide\">가이드 저장</button></div>\n<h2>시작 전 준비</h2>\n<ul><li>게임을 한 번 진행하고 타이머, 힌트, 재시작을 확인합니다.</li><li>팀별 기기와 역할 카드 4장을 준비합니다. 게임 파일을 내려받아 예비로 둡니다.</li><li>참여자에게 시간 제한 해제, 화면 확대, 짝 읽기 등 필요한 방식을 안내합니다.</li><li>관찰표와 사전 문항을 준비합니다. 팀 이름은 별칭으로 입력합니다.</li></ul>\n<h2>10분 안내</h2>\n<div class=\"card\"><p>“예약 조회에 문제가 생겼습니다. 네 사람은 역할별 단서를 나눠 읽고 원인을 찾은 뒤, 복구 방법을 정합니다. 각자 맡은 카드에서 핵심 내용을 찾아 팀에 설명해 주세요. 코딩은 하지 않습니다.”</p>\n<p>“확인한 사실과 추측을 나눠 말하고, 모르는 내용은 힌트나 용어 설명을 사용하세요. 결정하기 전에 네 사람의 의견을 듣겠습니다. 게임이 끝나면 왜 그렇게 판단했는지 함께 이야기하겠습니다.”</p>\n<p>“팀 이름에는 별칭을 쓰고, 고객 정보는 입력하지 마세요. 기록은 이 기기에 저장됩니다.”</p></div>\n<h2>역할과 진행</h2>\n<p>역할은 운영, 구축, 차량·품질, 고객 지원입니다. 첫 설명 담당은 미션마다 한 칸씩 바꾸고, 입력 담당도 돌아가며 맡습니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>시점</th><th>진행자 할 일</th><th>질문 예시</th></tr></thead><tbody><tr><td>시작</td><td>역할 배정, 35분 타이머 시작</td><td>“각자 어떤 정보를 찾게 되나요?”</td></tr><tr><td>8분</td><td>아직 말하지 않은 단서가 있는지 확인</td><td>“다른 역할이 알고 있는 정보는 무엇인가요?”</td></tr><tr><td>18분</td><td>팀의 원인 가설과 근거 확인</td><td>“어떤 두 자료를 연결했나요?”</td></tr><tr><td>28분</td><td>복구 확인과 인수인계 안내</td><td>“고객 결과와 남은 일은 무엇인가요?”</td></tr><tr><td>35분</td><td>현재 상태를 기록하고 디브리핑으로 이동</td><td>미완료 팀은 인수인계부터 작성</td></tr></tbody></table></div>\n<h2>미션 정답과 진행 질문</h2>\n<details><summary>1. 업무 구분 — 암호 427</summary><p>신규 시스템 구축은 SI, 기존 서비스 운영은 ITO, 차량 소프트웨어 개발·검증은 차량 SW입니다. 번호 4 → 2 → 7을 입력합니다.</p><p>질문: “새로 만드는 일과 계속 운영하는 일을 어떤 단서로 구분했나요?”</p></details>\n<details><summary>2. 고객 영향 — 예약 조회부터 확인</summary><p>서버는 응답하지만 예약 조회가 되지 않습니다. 영향 범위를 확인하고 운영·개발·검증·고객 담당을 연결합니다. 고객 이름과 연락처는 공유하지 않습니다.</p><p>질문: “확인된 사실과 아직 모르는 내용은 무엇인가요?”</p></details>\n<details><summary>3. 원인 찾기 — 캐시 80초, 앱 기준 30초, 변경 시각 0912</summary><p>09:12에 캐시 시간이 20초에서 80초로 바뀌었습니다. 앱은 30초가 넘은 결과를 표시하지 않기 때문에 예약이 보이지 않습니다.</p><p>질문: “서버가 정상인데 앱에 예약이 보이지 않은 이유는 무엇인가요?”</p></details>\n<details><summary>4. 복구 계획 — 검증 후 단계 적용</summary><p>이전 설정을 확인하고 승인받은 뒤 일부 범위부터 적용합니다. 예약 조회를 확인하고, 이상이 생길 때 중단할 기준도 둡니다.</p><p>질문: “무엇을 확인해야 복구됐다고 말할 수 있나요?”</p></details>\n<details><summary>5. 최종 확인 — 중복 기록, 재검증, 인수인계</summary><p>예약 요청 R-87의 기록이 두 건입니다. 기록을 대조하고 정정 뒤 고객 화면을 재확인합니다. 남은 일과 다음 담당자, 안내 시각을 기록합니다.</p><p>질문: “상태 화면이 정상으로 바뀐 뒤 어떤 문제가 남았나요?”</p></details>\n<h2>20분 디브리핑</h2>\n<div class=\"table-scroll\"><table><thead><tr><th>시간</th><th>질문</th></tr></thead><tbody><tr><td>3분</td><td>가장 기억에 남는 단서나 선택은 무엇인가요?</td></tr><tr><td>6분</td><td>어떤 근거로 판단했고, 다른 역할의 정보가 생각을 바꿨나요?</td></tr><tr><td>6분</td><td>실제 업무에서 누구에게 어떤 내용을 물어봐야 할까요?</td></tr><tr><td>5분</td><td>고객에게 결과를 알리기 전 무엇을 확인하고 인계해야 하나요?</td></tr></tbody></table></div>\n<h2>인수인계 메모</h2><ol><li>확인된 영향과 사실:</li><li>조치 결과와 아직 남은 일:</li><li>다음 담당자와 확인·안내 시각:</li></ol>\n<h2>관찰표</h2>\n<p>각 항목을 0점(관찰되지 않음), 1점(질문 뒤 수행), 2점(스스로 수행)으로 기록합니다. 관찰하지 못한 항목은 ‘미관찰’로 표시합니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>행동</th><th>점수</th><th>관찰 메모</th></tr></thead><tbody><tr><td>역할별 단서를 공유한다.</td><td>0 / 1 / 2 / 미관찰</td><td></td></tr><tr><td>두 가지 이상 근거로 판단을 설명한다.</td><td>0 / 1 / 2 / 미관찰</td><td></td></tr><tr><td>담당자와 확인할 내용을 구체적으로 요청한다.</td><td>0 / 1 / 2 / 미관찰</td><td></td></tr><tr><td>고객 결과와 남은 일을 기록한다.</td><td>0 / 1 / 2 / 미관찰</td><td></td></tr></tbody></table></div>\n<h2>사전·사후 문항</h2>\n<p>각 5문항. 시작 전에는 정답을 공개하지 않습니다.</p>\n<div class=\"table-scroll\"><table><thead><tr><th>영역</th><th>문항 A / B</th><th>선택지</th><th>정답</th></tr></thead><tbody>\n<tr><td>업무 구분</td><td>A 새 시스템을 분석·구축하는 업무는?<br>B 운영 중인 시스템의 장애를 처리하는 업무는?</td><td>SI / ITO / 차량 SW</td><td>A SI<br>B ITO</td></tr>\n<tr><td>고객 영향</td><td>A 서버가 정상인데 예약이 보이지 않으면?<br>B 예약 기록이 두 건이면?</td><td>① 사용 실수로 처리<br>② 해당 기능·기록 확인<br>③ 전체 장애 공지</td><td>②</td></tr>\n<tr><td>정보 공유</td><td>A 장애 사례를 협업 담당자에게 보낼 때?<br>B 오류를 다른 담당자에게 문의할 때?</td><td>① 고객 정보가 담긴 원문<br>② 확인되지 않은 영향 범위<br>③ 발생 시각·증상·익명 요청 ID</td><td>③</td></tr>\n<tr><td>복구 계획</td><td>A 설정을 바꾸기 전 확인할 것은?<br>B 적용 범위를 넓히기 전 확인할 것은?</td><td>① 검증·승인·중단 기준<br>② 전체 재시작<br>③ 상태 감시 중단</td><td>①</td></tr>\n<tr><td>인수인계</td><td>A 교대 때 남길 내용은?<br>B 복구 후 넘길 내용은?</td><td>① 정상이라는 한 문장<br>② 영향·조치·남은 일·담당자·시각<br>③ 책임자 추측</td><td>②</td></tr>\n</tbody></table></div><h2>기록과 예외 상황</h2>\n<ul><li>진행 기록은 사용 중인 브라우저에 저장됩니다. 결과 파일은 필요할 때 진행자가 내려받습니다.</li><li>시간이 끝나면 남은 문제를 인수인계 메모에 적고 디브리핑으로 이동합니다.</li><li>기기 문제가 생기면 타이머를 멈추고 저장한 게임 파일이나 역할 카드로 이어갑니다.</li><li>한 사람이 답을 주도하면 입력 담당을 바꾸고, 아직 말하지 않은 역할에 먼저 질문합니다.</li></ul>\n</div>";



function fresh(mode,team,now){return {version:1,mode:mode,team:team||'DAY ZERO 팀',stage:0,status:'playing',paused:false,remaining:mode==='untimed'?null:(mode==='demo'?720:2100),deadline:mode==='untimed'?null:now+(mode==='demo'?720000:2100000),startedAt:now,read:Array.from({length:5},function(){return [false,false,false,false]}),attempts:[0,0,0,0,0],firstPoints:[null,null,null,null,null],hints:[0,0,0,0,0],history:[],decisions:{},quiz:null,reflection:''};}
function timeLeft(s,now){if(s.remaining===null)return null;if(s.paused||s.status!=='playing')return Math.max(0,s.remaining);return Math.max(0,Math.ceil((s.deadline-now)/1000));}
function expire(s,now){if(s.status==='playing'&&!s.paused&&s.deadline!==null&&timeLeft(s,now)===0){s.remaining=0;s.status='timeout';s.history.push({mission:s.stage,event:'시간 종료',text:'제한시간 종료. 현재 상황을 인수인계합니다.',at:now});return true}return false;}
function pauseState(s,now){if(s.status!=='playing'||s.remaining===null)return;if(!s.paused){s.remaining=timeLeft(s,now);s.paused=true;s.deadline=null}else{s.deadline=now+s.remaining*1000;s.paused=false}}
function solve(s,a,now){if(s.status!=='playing')return {ok:false,message:'이미 종료된 세션입니다.'};if(expire(s,now))return {ok:false,timeout:true,message:'제한시간이 종료됐습니다.'};if(s.paused)return {ok:false,message:'타이머를 재개한 뒤 결정하세요.'};const i=s.stage;if(!s.read[i].every(Boolean))return {ok:false,message:'네 역할의 단서를 확인하고 팀에 공유 표시를 해주세요.'};let correct=false,p=0,text='',adv=true;
if(i===0){correct=a.si==='si'&&a.ito==='ito'&&a.sw==='sw'&&String(a.code).trim()==='427';p=correct?4:0;adv=correct;text=correct?'구축(SI) 4 → 운영(ITO) 2 → 차량 SW 7. 서로 다른 업무가 연결됩니다.':'업무 연결과 서류함 순서를 다시 확인하세요. 새로운 시스템을 만드는 것은 SI, 기존 서비스를 운영하는 것은 ITO입니다.'}
if(i===1){const ch=missions[1].choices.find(function(c){return c.id===a.choice});if(!ch)return {ok:false,message:'첫 대응을 하나 선택하세요.'};p=ch.points;correct=p===4;text=ch.feedback;s.decisions.triage=ch.id}
if(i===2){correct=a.root==='cache'&&String(a.code).trim()==='0912';p=correct?4:0;adv=correct;text=correct?'서버의 재사용 시간 80초와 앱의 허용 기준 30초가 충돌합니다. 관련 설정 변경은 09:12입니다. 아직 원인 가설이므로 복구 전 검증이 필요합니다.':'응답은 성공했지만 데이터가 오래되어 앱이 표시하지 않습니다. 관련 설정 변경의 시각과 가설을 함께 확인하세요.'}
if(i===3){const ch=missions[3].choices.find(function(c){return c.id===a.choice});if(!ch)return {ok:false,message:'복구 계획을 하나 선택하세요.'};p=ch.points;correct=p>=3;text=ch.feedback;s.decisions.restore=ch.id}
if(i===4){const v=Array.isArray(a.choices)?a.choices:[];if(v.length!==3)return {ok:false,message:'최종 조치 세 가지를 선택하세요.'};const safe=['reconcile','retest','handover'];p=safe.filter(function(x){return v.includes(x)}).length;correct=v.every(function(x){return safe.includes(x)})&&v.length===3;p=correct?4:Math.max(0,p-1);s.decisions.verify=v;text=correct?'기록을 보존해 대조하고, 승인된 정정과 재검증을 거쳐 남은 문제를 인수인계했습니다. 고객의 실제 결과까지 확인하는 복구입니다.':'원본 대조와 승인 없이 기록을 삭제하거나, 고객 결과를 확인하지 않고 종료하면 미해결 문제가 남습니다. 결과 화면에서 선택의 영향을 확인하세요.'}
s.attempts[i]++;if(s.firstPoints[i]===null)s.firstPoints[i]=p;s.history.push({mission:i,event:adv?'결정':'재검토',answer:a,points:p,text:text,at:now});if(adv){s.stage++;if(s.stage===5){s.remaining=timeLeft(s,now);s.status='complete';s.finishedAt=now}}return {ok:true,advance:adv,correct:correct,message:text,mission:i};
}
function ending(s){if(s.status==='timeout')return {title:'인수인계가 필요합니다',tag:'인수인계 필요',desc:'시간이 끝났습니다. 현재 상태와 다음에 확인할 일을 정리하세요.',tone:'warn'};
const v=s.decisions.verify||[];if(v.includes('erase')||v.includes('ignore'))return {title:'예약 기록이 남아 있습니다',tag:'미해결 항목',desc:'상태 화면은 정상이어도 예약 기록은 두 건 남아 있습니다. 기록과 고객 결과를 확인하세요.',tone:'error'};

function feedbackHTML(){return topHTML()+'<section class="setup" style="max-width:850px;margin:38px auto"><div class="kicker">선택 결과 / 미션 '+(feedback.mission+1)+'</div><h2 tabindex="-1">'+(feedback.advance?(feedback.correct?'단서를 연결했습니다.':'이 선택으로 이런 일이 생겼습니다.'):'잠금이 풀리지 않았습니다.')+'</h2><div class="note '+(feedback.correct?'':feedback.advance?'warn':'error')+'">'+esc(feedback.message)+'</div><p class="muted">팀 대화: 어떤 단서로 판단했고, 더 확인할 내용은 무엇인가요?</p><button class="btn" data-action="next">'+(feedback.advance?(state.stage===5?'엔딩과 학습 기록 보기':'다음 미션으로'):'단서 다시 확인')+' <span aria-hidden="true">→</span></button></section>'}
function resultHTML(){const e=ending(state),score=state.firstPoints.reduce(function(a,v){return a+(v||0)},0),names=['사업 구분','영향 판단','근거 연결','복구 계획','고객 결과 확인'];return '<div class="result"><div class="kicker">'+e.tag+'</div><h1 tabindex="-1">'+e.title+'</h1><p class="hero-lead">'+e.desc+'</p><div class="note '+(e.tone==='good'?'':e.tone)+'"><b>'+esc(state.team)+'</b> / '+(state.mode==='team'?'35분 교육':state.mode==='demo'?'12분 시연':'시간 제한 없음')+' / '+state.stage+'개 미션 완료<br></div><div class="grid2"><div class="card"><div class="kicker">첫 선택 기록</div><h3>미션별 점수</h3><div class="score">'+score+'<span class="muted" style="font-size:20px"> / 20</span></div><p>미션마다 첫 선택을 기록합니다. 힌트와 재도전은 감점하지 않습니다.</p>'+names.map(function(n,i){const p=state.firstPoints[i];return '<div class="dimension">'+n+'<span>'+(p===null?'미응답':p+' / 4')+'</span><div class="bar"><i style="width:'+((p||0)*25)+'%"></i></div></div>'}).join('')+'</div><div class="card"><div class="kicker">팀 회고</div><h3>함께 돌아보기</h3><p>서버가 정상이라는 신호와 고객이 정상적으로 사용하는 것은 어떻게 달랐나요?</p><p>다른 역할의 단서가 내 판단을 바꿨나요?</p><p>실제 업무에서 모르는 일이 생기면 누구에게 무엇을 물어보겠어요?</p><label>회고 메모 <span class="smalltext">(개인정보 입력 금지)</span><textarea id="reflection" maxlength="1200" placeholder="다음에 확인할 사실, 도움을 요청할 대상, 남길 기록">'+esc(state.reflection||'')+'</textarea></label></div></div><div class="actions"><button class="btn" data-nav="quiz">5문항 확인</button><button class="btn secondary" data-action="export">결과 JSON 저장</button><button class="btn secondary" data-nav="guide">디브리핑 질문 보기</button><button class="btn ghost" data-nav="home">새 게임 준비</button></div><div class="learning"><h2>우리 팀의 선택 이력</h2>'+state.history.map(function(h){return '<details><summary>미션 '+(h.mission+1)+' / '+esc(h.event)+(h.points!==undefined?' / 해당 제출 '+h.points+'점':'')+'</summary><p>'+esc(h.text)+'</p>'+(h.answer&&h.answer.reason?'<p><b>팀 메모:</b> '+esc(h.answer.reason)+'</p>':'')+'</details>'}).join('')+'</div></div>'}
function rolesHTML(){return '<div class="doc"><div class="kicker">역할 카드 / 4명</div><h1>네 개의 역할 카드</h1><div class="note warn">전체 미션의 단서가 있습니다. 팀원에게 역할별로 한 장씩 나눠주세요.</div><div class="actions no-print"><button class="btn" data-action="print">역할 카드 인쇄</button><button class="btn secondary" data-nav="home">게임 준비로</button></div>'+roles.map(function(r,i){return '<section class="role-sheet"><div class="kicker">'+r.code+'</div><h3>'+r.name+'</h3><p>'+r.desc+' 맡은 단서를 설명하고 필요한 정보를 물어보세요.</p>'+missions.map(function(m,j){const d=m.docs[i];return '<h4>미션 '+(j+1)+' · '+m.label+'</h4><p>'+d.text+'</p><pre>'+esc(d.log)+'</pre>'}).join('')+'</section>'}).join('')+'</div>'}
function quizHTML(){const result=state&&state.quiz||standaloneQuiz;return '<div class="doc"><div class="kicker">게임 내용 확인 / 5문항</div><h1>게임 내용 확인</h1><p class="intro">5문항으로 게임에서 다룬 내용을 확인합니다.</p>'+(result?'<div class="note"><b>'+result.score+' / 5 정답</b><br>오답 해설을 확인하세요.</div>':'')+'<form id="quiz-form">'+quiz.map(function(q,i){return '<fieldset class="quiz-q" style="border-left:0;border-right:0;border-top:0"><legend>'+ (i+1)+'. '+q.q+'</legend>'+q.options.map(function(t,j){return '<label class="choice"><input type="radio" name="q'+i+'" value="'+j+'" '+(result&&result.answers[i]===j?'checked':'')+' required>'+esc(t)+'</label>'}).join('')+(result?'<p class="smalltext"><b>'+(result.answers[i]===q.correct?'정답':'다시 확인')+'</b> — '+q.why+'</p>':'')+'</fieldset>'}).join('')+'<button class="btn" type="submit">답 확인</button> <button class="btn secondary" type="button" data-nav="game">게임·결과로</button></form></div>'}
function download(name,content,mime){const url=URL.createObjectURL(new Blob([content],{type:mime||'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},1000)}
function downloadGame(){const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';const to=clone.querySelector('#toast');if(to)to.remove();download('day-zero-game.html','<!DOCTYPE html>\n'+clone.outerHTML,'text/html;charset=utf-8');toast('단일 HTML 게임 파일을 저장했습니다. 내려받은 파일은 인터넷 없이 열 수 있습니다.')}
function exportResult(){if(!state){toast('먼저 게임을 시작해주세요.');return}const txt=document.getElementById('reflection');if(txt)state.reflection=txt.value;capture();save();const out={program:'DAY ZERO',proposal:'현대오토에버 신입사원 온보딩 개인 기획안',exportedAt:new Date().toISOString(),team:state.team,mode:state.mode,status:state.status,completedMissions:state.stage,firstDecisionPoints:state.firstPoints,attempts:state.attempts,hints:state.hints,sharedMarkers:state.read,recordCaution:'게임 점수는 업무 역량 평가에 사용하지 않음',decisions:state.decisions,history:state.history,knowledgeCheck:state.quiz,reflection:state.reflection};download('day-zero-result.json',JSON.stringify(out,null,2),'application/json;charset=utf-8');toast('결과 기록을 저장했습니다.')}
document.getElementById('app').addEventListener('submit',function(ev){ev.preventDefault();const form=ev.target;if(form.id==='start-form'){const f=new FormData(form);state=fresh(String(f.get('mode')),String(f.get('team')||'복구팀 01').trim().slice(0,24),Date.now());feedback=null;roleIndex=0;save();navigate('game');return}if(form.id==='mission-form'){capture();const d=draft(),r=solve(state,d,Date.now());save();if(r.timeout){feedback=null;render();return}if(!r.ok){toast(r.message);return}feedback=r;roleIndex=0;render();window.scrollTo(0,0);return}if(form.id==='quiz-form'){const f=new FormData(form),answers=quiz.map(function(q,i){return Number(f.get('q'+i))}),result={score:answers.filter(function(v,i){return v===quiz[i].correct}).length,answers:answers,at:Date.now()};if(state){state.quiz=result;save()}else standaloneQuiz=result;render();window.scrollTo(0,0);}});
document.addEventListener('click',function(ev){const b=ev.target.closest('button');if(!b)return;if(b.dataset.nav){navigate(b.dataset.nav);return}if(b.dataset.role!==undefined){capture();roleIndex=Number(b.dataset.role);save();render();return}const a=b.dataset.action;if(a==='share'&&state&&state.stage<5){capture();state.read[state.stage][roleIndex]=true;save();render()}if(a==='hint'&&state&&state.stage<5){capture();state.hints[state.stage]=Math.min(2,state.hints[state.stage]+1);save();render()}if(a==='pause'&&state){capture();pauseState(state,Date.now());save();render()}if(a==='next'){feedback=null;render();window.scrollTo(0,0)}if(a==='clear'){try{localStorage.removeItem(KEY)}catch(e){}state=null;feedback=null;roleIndex=0;navigate('home');toast('이 브라우저의 게임 기록을 지웠습니다.')}if(a==='print'){window.print()}if(a==='downloadGame')downloadGame();if(a==='downloadGuide'){const plain=GUIDE.replace(/<\/(p|h1|h2|h3|li|summary|td|th|tr|div|section)>/g,'\n\n').replace(/<[^>]+>/g,'').replace(/\n{3,}/g,'\n\n');download('day-zero-facilitator-guide.txt',plain);toast('운영 가이드 텍스트를 저장했습니다.')}if(a==='export')exportResult();});
document.addEventListener('keydown',function(e){if(!e.target.closest('.role-tabs'))return;let n=roleIndex;if(e.key==='ArrowRight')n=(roleIndex+1)%4;else if(e.key==='ArrowLeft')n=(roleIndex+3)%4;else if(e.key==='Home')n=0;else if(e.key==='End')n=3;else return;e.preventDefault();capture();roleIndex=n;save();render();const b=document.querySelector('[data-role="'+n+'"]');if(b)b.focus()});
document.addEventListener('input',function(e){if(e.target.id==='reflection'&&state){state.reflection=e.target.value;save()}});
window.addEventListener('hashchange',function(){const v=location.hash.slice(1);if(['home','game','proposal','guide','roles','quiz'].includes(v)){view=v;feedback=null;render();window.scrollTo(0,0)}});
window.addEventListener('beforeunload',function(){capture();save()});
setInterval(function(){if(!state||state.status!=='playing')return;if(expire(state,Date.now())){feedback=null;view='game';history.replaceState(null,'','#game');save();render();window.scrollTo(0,0);return}const t=document.getElementById('clock');if(t){const l=timeLeft(state,Date.now());t.textContent=fmt(l);t.classList.toggle('low',l!==null&&l<120)}},1000);
const hash=location.hash.slice(1);view=['home','game','proposal','guide','roles','quiz'].includes(hash)?hash:'home';if(state&&expire(state,Date.now()))save();render();
</script></body></html>
